<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>زجاج صدام</title>
<meta name="theme-color" content="#eef3f2">
<meta name="description" content="زجاج صدام: البيع بالكريدي، ديون ورشات الألمنيوم، وسطوك الزجاج">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="زجاج صدام">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<script>
try{var p=JSON.parse(localStorage.getItem('sz-prefs')||'{}');var h=document.documentElement;
if(p.theme==='dark'||p.theme==='light')h.setAttribute('data-theme',p.theme);
if(p.lang==='fr'){h.lang='fr';h.dir='ltr'}}catch(e){}
</script>
<style>
/* Layout: phone-first ledger. Sticky brand bar, one scrolling column, five-tab bottom bar with a raised "new sale" button. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface2:#f6f9f8; --sunk:#e5edeb; --ink:#10201e; --muted:#566865; --faint:#869794; --line:#d9e3e1;
  --accent:#17635e; --accent-2:#0f4b47; --accent-ink:#ffffff; --accent-soft:#dbece8; --edge:#9fd3c7;
  --debt:#b0392d; --debt-soft:#f8e2de; --warn:#8f5d0a; --warn-soft:#f6ebd2; --ok:#22703e; --ok-soft:#dcefe2;
  --shadow:0 1px 2px rgba(16,32,30,.05),0 6px 18px rgba(16,32,30,.06);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* top bar */
.top{position:sticky;top:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.15;display:block}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:4px calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.32rem;margin:0;text-wrap:balance;line-height:1.3}
h3{font-size:.78rem;font-weight:600;color:var(--muted);margin:6px 0 0;letter-spacing:.03em;text-transform:uppercase}
.note{font-size:.85rem;color:var(--muted)}
p.note{margin:0;max-width:60ch}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.hero{background:linear-gradient(160deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:30px;transform:rotate(25deg);background:rgba(255,255,255,.08)}
.hero .lbl{font-size:.82rem;opacity:.85}
.hero .big{font-family:var(--f-body);font-size:2.15rem;font-weight:700;line-height:1.1}
.hero .big small{font-size:1rem;font-weight:500;opacity:.85}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem}
.hero .sub b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.tile .lbl{font-size:.76rem;color:var(--muted)}
.tile .v{font-weight:700;font-size:1.12rem}
.tile .v.ok{color:var(--ok)}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--ink);box-shadow:var(--shadow);text-align:center;line-height:1.25}
.qa .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.sec h3{margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:start;width:100%;min-height:58px}
.row:last-child{border-bottom:0}
button.row:active,button.row:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:1rem}
.av.bad{background:var(--debt-soft);color:var(--debt)}
.av.warn{background:var(--warn-soft);color:var(--warn)}
.rleft{display:flex;align-items:center;gap:12px;min-width:0}
.rmain{display:flex;flex-direction:column;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:.78rem;color:var(--muted)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.amt{font-weight:700;white-space:nowrap}
.amt.neg{color:var(--debt)}
.amt.pos{color:var(--ok)}
.chip{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--debt-soft);color:var(--debt)}
.acts{display:flex;gap:6px}
.mini-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent);text-decoration:none}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* chart */
.chart{padding:14px 16px 10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* buttons & forms */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--accent);padding-inline:8px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--debt);border:1px solid var(--debt-soft)}
.btn.danger[data-armed]{background:var(--debt);color:var(--surface)}
.btn.full{width:100%;padding-block:13px}
.btn:disabled{opacity:.55;cursor:default}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{width:100%}
.line-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.lt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.ld{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:7px 10px;gap:8px;flex-wrap:wrap}
.lr b{color:var(--ink)}
.avail{font-size:.8rem}
.avail.short{color:var(--debt);font-weight:600}
.x{background:transparent;border:1px solid var(--line);border-radius:11px;width:44px;height:44px;color:var(--muted);font-size:1.1rem}
.totals{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.trow.big{font-size:1.2rem;font-weight:700}
.quickpay{display:flex;gap:6px;flex-wrap:wrap}
.quickpay button{background:var(--sunk);border:0;border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ledger rows */
.led{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.le{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.le:last-child{border-bottom:0}
button.le:hover{background:var(--surface2)}
.le .what{font-weight:600}
.le .d{font-size:.78rem;color:var(--muted)}
.le .run{font-size:.78rem;color:var(--muted);text-align:end}
.le .a{text-align:end;font-weight:700}
.le.pay .a{color:var(--ok)}
.le .del{grid-column:2;grid-row:2;justify-self:end;padding:3px 10px;font-size:.75rem}
.balbox{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-weight:600;color:var(--muted);font-size:.74rem;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl input{padding:7px 8px;border-radius:8px;min-width:90px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.typerow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.copyfall{width:100%;min-height:140px;font-size:.85rem}

/* stock */
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.sk .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sk .q{font-size:1.4rem;font-weight:700;line-height:1.2}
.sk .q.low{color:var(--warn)}
.sk .q.out{color:var(--debt)}
.sk .meta{font-size:.76rem;color:var(--muted);display:flex;flex-direction:column}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn)}.bar i.out{background:var(--debt)}

/* settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.set-row:last-child{border-bottom:0}
.set-row .t{display:flex;align-items:center;gap:12px;min-width:0}
.set-row .t span{display:flex;flex-direction:column}
.set-row .t small{color:var(--muted);font-size:.78rem}
.set-row .ib{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.set-block{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.set-block:last-child{border-bottom:0}
.profile{display:flex;align-items:center;gap:14px;padding:16px}
.profile .av{width:52px;height:52px;border-radius:16px;font-size:1.3rem}

/* steps (import) */
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.prompt{background:var(--sunk);border-radius:12px;padding:12px;font-size:.84rem;white-space:pre-wrap;line-height:1.6}

/* gate (login) */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 70% at 50% 0%,var(--accent-soft),var(--bg) 70%)}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.gate-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gate-head .mark{width:72px;height:72px;border-radius:20px}
.gate-head b{font-family:var(--f-disp);font-size:1.6rem;font-weight:700}
.gate-head span{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.gate-lang{display:flex;justify-content:center}
.gate-lang .seg{width:180px}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-align:center;background:var(--sunk);border-radius:12px;padding:14px;direction:ltr}
.err{color:var(--debt);font-size:.86rem;min-height:1.2em;margin:0}

/* bottom nav */
nav.bottom{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:620px;margin:0 auto;align-items:end}
nav.bottom button{background:transparent;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--faint)}
nav.bottom button.on{color:var(--accent)}
nav.bottom button.main{transform:translateY(-12px)}
nav.bottom button.main .ib{width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
nav.bottom button.main .ic{width:26px;height:26px;stroke-width:2.2}
nav.bottom button.main span{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (max-width:360px){.skgrid,.tiles{grid-template-columns:minmax(0,1fr)}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="shell" hidden>
  <header class="top"><div class="in">
    <div class="brand" id="brand"></div>
    <button class="iconbtn" data-act="lock" id="lockbtn"></button>
  </div></header>
  <main class="app" id="main"></main>
  <nav class="bottom"><div class="in" id="nav"></div></nav>
</div>
<div id="boot" class="gate"><div class="gate-head"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#17635e"/></svg></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ====================== prefs & language ====================== */
const PREF_KEY='sz-prefs';
const prefs={lang:'ar',theme:'system',lock:30};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(_){}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(_){}}
const isFr=()=>prefs.lang==='fr';
const tr=(a,f)=>isFr()?f:a;
function applyPrefs(){
  const h=document.documentElement;h.lang=prefs.lang;h.dir=isFr()?'ltr':'rtl';
  if(prefs.theme==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',prefs.theme);

const LocalDB=(()=>{
  let idb=null;const mem=new Map();const listeners=new Set();
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const colOf=p=>p.slice(0,p.lastIndexOf('/'));
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open('daftar-zujaj',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
  async function load(){idb=await open();await new Promise((res,rej)=>{const rq=idb.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
  function tx(fn){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=()=>res();const bad=()=>rej({code:t.error&&t.error.name==='QuotaExceededError'?'quota_exceeded':'unavailable',message:String(t.error)});t.onerror=bad;t.onabort=bad})}
  const docSnap=p=>{const d=mem.get(p);return{id:p.slice(p.lastIndexOf('/')+1),exists:d!==undefined,data:()=>d}};
  const colSnap=c=>{const docs=[];for(const [k,v] of mem)if(colOf(k)===c)docs.push({id:k.slice(k.lastIndexOf('/')+1),exists:true,data:()=>v});return{docs,size:docs.length,empty:!docs.length}};
  function emit(paths){const cols=new Set(paths.map(colOf));for(const l of listeners){if(l.kind==='doc'&&paths.includes(l.path))l.fn(docSnap(l.path));if(l.kind==='col'&&cols.has(l.path))l.fn(colSnap(l.path))}}
  function doc(p){return{id:p.slice(p.lastIndexOf('/')+1),path:p,
    async set(d){const v=JSON.parse(JSON.stringify(d));await tx(s=>s.put(v,p));mem.set(p,v);emit([p])},
    async update(d){const cur=mem.get(p);if(!cur)throw{code:'invalid_argument'};const v={...cur,...JSON.parse(JSON.stringify(d))};await tx(s=>s.put(v,p));mem.set(p,v);emit([p])},
    async delete(){await tx(s=>s.delete(p));mem.delete(p);emit([p])},
    async get(){return docSnap(p)},
    onSnapshot(fn){const l={kind:'doc',path:p,fn};listeners.add(l);setTimeout(()=>fn(docSnap(p)));return()=>listeners.delete(l)}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||rid())),onSnapshot(fn){const l={kind:'col',path:c,fn};listeners.add(l);setTimeout(()=>fn(colSnap(c)));return()=>listeners.delete(l)}}}
  function dump(){const o={};for(const [k,v] of mem)o[k]=v;return o}
  async function replaceAll(obj){const old=[...mem.keys()];await tx(s=>{s.clear();for(const k in obj)s.put(obj[k],k)});mem.clear();for(const k in obj)mem.set(k,obj[k]);
    emit([...new Set([...old,...Object.keys(obj),'settings/main','clients/x','bons/x','payments/x','stock/x','auth/main'])])}
  return{load,doc,collection,dump,replaceAll};
})();

function compute(){
  const st={};
  for(const id in S.clients)st[id]={sales:0,paid:0,bal:0,lastPay:null,oldestBon:null,lastAct:null};
  for(const id in S.bons){const b=S.bons[id],s=st[b.clientId];if(!s)continue;s.sales+=num(b.total);if(!s.oldestBon||b.date<s.oldestBon)s.oldestBon=b.date;if(!s.lastAct||b.date>s.lastAct)s.lastAct=b.date}
  for(const id in S.pays){const p=S.pays[id],s=st[p.clientId];if(!s)continue;s.paid+=num(p.amount);if(!s.lastPay||p.date>s.lastPay)s.lastPay=p.date;if(!s.lastAct||p.date>s.lastAct)s.lastAct=p.date}
  for(const id in st){const s=st[id];s.bal=s.sales-s.paid;const ref=s.lastPay||s.oldestBon;s.age=s.bal>0&&ref?daysSince(ref):0}
  S.stats=st;
  const k={},mo=today().slice(0,7);
  const ent=(tid,name)=>k[tid]||(k[tid]={name,inA:0,outA:0,adjA:0,monthOut:0,last:null,bal:0});
  for(const t of types())ent(t.id,t.name);
  const mv=Object.values(S.stock).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const m of mv){const e=ent(m.typeId,m.type);if(m.kind==='in'){e.inA+=num(m.area);e.last=m}else e.adjA+=num(m.area)}
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;for(const l of b.lines||[]){const e=ent(l.typeId,l.type);e.outA+=num(l.area);if(b.date&&b.date.slice(0,7)===mo)e.monthOut+=num(l.area)}}
  for(const id in k){const e=k[id];e.bal=e.inA+e.adjA-e.outA;e.sheet=e.last?num(e.last.sw)*num(e.last.sh)/10000:null}
  S.sk=k;
}

    if(!user)return setErr(tr('اكتب اسم المستخدم.','Saisissez un nom d’utilisateur.'));
    if(p1.length<4)return setErr(tr('كلمة السر لازم 4 حروف على الأقل.','Le mot de passe doit faire au moins 4 caractères.'));
    if(p1!==p2)return setErr(tr('كلمتين السر ماهمش كيف كيف.','Les mots de passe ne correspondent pas.'));
    const salt=randB64(),rsalt=randB64(),code=newRecovery();
    const hash=await hashPw(p1,salt),rhash=await hashPw(code.replace(/\D/g,''),rsalt);
    recoveryShown=code;gateMode='recovery';gateErr='';
    if(!await write(()=>db.doc('auth/main').set({name,user,salt,hash,rsalt,rhash,iter:150000,createdAt:Date.now()}))){gateMode='setup';recoveryShown=null}
    renderGate();return}
  if(form==='login'){
    const f=failState();if(f.until>Date.now())return setErr(tr(`بزاف محاولات. استنى ${Math.ceil((f.until-Date.now())/1000)} ثانية.`,`Trop d’essais. Attendez ${Math.ceil((f.until-Date.now())/1000)} s.`));
    const a=S.auth,user=normUser(v('g-user')),pw=v('g-pass');
    const h=await hashPw(pw,a.salt);
    if(user===a.user&&h===a.hash){setFail({n:0,until:0});unlocked=true;gateErr='';touch(true);gateMode=null;startApp();return}
    const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});
    $('#g-pass').value='';return setErr(n>=5?tr('5 محاولات غالطة. استنى 30 ثانية.','5 essais erronés. Attendez 30 s.'):tr('اسم المستخدم ولا كلمة السر غالطين.','Nom d’utilisateur ou mot de passe incorrect.'))}
  if(form==='forgot'){
    const a=S.auth,code=v('g-code').replace(/\D/g,''),p1=v('g-pass'),p2=v('g-pass2');
    const f=failState();if(f.until>Date.now())return setErr(tr('بزاف محاولات. استنى شوية.','Trop d’essais. Patientez.'));
    if(await hashPw(code,a.rsalt)!==a.rhash){const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});return setErr(tr('رمز الاسترجاع غالط.','Code de secours incorrect.'))}
    if(p1.length<4)return setErr(tr('كلمة السر لازم 4 حروف على الأقل.','Le mot de passe doit faire au moins 4 caractères.'));
    if(p1!==p2)return setErr(tr('كلمتين السر ماهمش كيف كيف.','Les mots de passe ne correspondent pas.'));
    const salt=randB64();const hash=await hashPw(p1,salt);
    if(await write(()=>db.doc('auth/main').update({salt,hash}),tr('تبدلت كلمة السر.','Mot de passe changé.'))){setFail({n:0,until:0});unlocked=true;touch(true);gateMode=null;gateErr='';startApp()}
  }
}
function decideGate(){
  if(!S.ok.a)return 'loading';
  if(gateMode==='recovery'||gateMode==='forgot')return gateMode;
  if(!S.auth)return 'setup';
  if(!sessionValid()){unlocked=false;return 'login'}
  unlocked=true;return null;
}
function renderGate(){
  applyPrefs();$('#boot').hidden=true;$('#shell').hidden=true;const g=$('#gate');g.hidden=false;g.innerHTML=gateHTML();
  const f=g.querySelector('input:not([value]),input[value=""]')||g.querySelector('input');if(f&&gateMode!=='recovery')setTimeout(()=>{try{f.focus()}catch(_){}},50);
}
function lockNow(){endSession();gateMode='login';gateErr='';renderGate()}

function chart7(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const s=days.map(d=>0),p=days.map(d=>0);
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;const i=days.indexOf(b.date);if(i>=0)s[i]+=num(b.total)}
  for(const id in S.pays){const x=S.pays[id];const i=days.indexOf(x.date);if(i>=0)p[i]+=num(x.amount)}
  const max=Math.max(...s,...p);if(!max)return'';
  const W=320,H=130,top=10,bot=22,ch=H-top-bot,gw=W/7,bw=Math.min(14,gw/3);
  const y=v=>top+ch-(v/max)*ch;
  const lab=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(isFr()?'fr-FR':'ar-DZ-u-nu-latn',{weekday:'short'})}catch(_){return d.slice(8)}};
  let g='';
  for(let i=0;i<7;i++){const ii=isFr()?i:6-i,cx=gw*ii+gw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(s[i])}" width="${bw}" height="${Math.max(0,top+ch-y(s[i]))}" rx="3" fill="var(--accent)"/>`;
    g+=`<rect x="${cx+1}" y="${y(p[i])}" width="${bw}" height="${Math.max(0,top+ch-y(p[i]))}" rx="3" fill="var(--edge)"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lab(days[i]))}</text>`}
  return `<div class="sec"><h3>${tr('آخر 7 أيام','7 derniers jours')}</h3><span class="note">${tr('أعلى يوم','Max')} ${DA(max)}</span></div>
  <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('المبيعات والمداخيل','Ventes et encaissements')}"><line x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)"/><line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 4"/>${g}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>${tr('مبيعات','Ventes')}</span><span><i style="background:var(--edge)"></i>${tr('مداخيل','Encaissements')}</span></div></div>`;
}

const normName=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'').replace(/```[a-z]*\n?/gi,'').trim();if(!text)return[];
  const first=text.split(/\r?\n/)[0];const sep=[',',';','\t','،'].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch;continue}
    if(ch==='"'){q=true;continue}
    if(ch===sep){cur.push('');continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;rows.push(cur);cur=[''];continue}
    cur[cur.length-1]+=ch}
  rows.push(cur);
  const money=v=>{let s=String(v||'').replace(/[^\d.,-]/g,'');if(/[.,]\d{1,2}$/.test(s))s=s.replace(/[.,]\d{1,2}$/,'');return s.replace(/[.,]/g,'')};
  const out=[];
  for(const r of rows){const c=r.map(x=>String(x).trim());if(!c.some(Boolean))continue;
    let [name,phone,debt,...rest]=c;
    if(c.length===2){debt=c[1];phone=''}
    const d=money(debt);
    if(!name||!/\d/.test(d||''))continue; /* header or junk */
    out.push({name,phone:phone||'',debt:d,note:rest.join(' ').trim(),on:true});
  }
  return out;
}

      if(t.dataset.lf==='typeId'){const ty=types().find(x=>x.id===t.value);if(ty){l.price=ty.price;const p=$('#lp'+t.dataset.i);if(p)p.value=ty.price}}
      updBon();return}
    if(t.id==='bd')draft.date=t.value;if(t.id==='bp'){draft.paid=t.value;updBon()}if(t.id==='bn')draft.note=t.value;
  }
  if(view.name==='pay'&&pdraft){if(t.id==='pa'){pdraft.amount=t.value;updPay()}if(t.id==='pd')pdraft.date=t.value;if(t.id==='pn')pdraft.note=t.value}
  if(view.name==='cform'&&cdraft){const k={cn:'name',co:'owner',cp:'phone',cd:'debt'}[t.id];if(k)cdraft[k]=t.value}
  if(view.name==='prices'&&tdraft&&t.dataset.tf){tdraft[+t.dataset.i][t.dataset.tf]=t.value}
  if(view.name==='kin'&&kdraft){const k={kd:'date',kn:'sheets',kw:'sw',kh:'sh',kc:'costM2',kp:'sell',ks:'supplier'}[t.id];if(k){kdraft[k]=t.value;updKin()}}
  if(view.name==='kadj'&&adraft){const k={ad:'date',ar:'real',an:'note'}[t.id];if(k){adraft[k]=t.value;updAdj()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lockSel'){prefs.lock=+t.value;savePrefs();if(prefs.lock>0)touch(true);toast(tr('تسجّل.','Enregistré.'));return}
  if(t.id==='imp-file'&&t.files&&t.files[0]){t.files[0].text().then(txt=>{imp.text=txt;imp.rows=parseCSV(txt);$('#imp-text').value=txt;$('#imp-rows').innerHTML=impRowsHTML()}).catch(()=>toast(tr('ما قدرتش نقرا الملف.','Lecture du fichier impossible.')));return}
  if(t.id==='imp'&&t.files&&t.files[0]){t.files[0].text().then(txt=>{let o;try{o=JSON.parse(txt)}catch(_){o=null}
    if(!o||o.app!=='daftar-zujaj'||!o.docs||typeof o.docs!=='object'){pendingImport=null;toast(tr('هذا الملف ماهوش نسخة من التطبيق.','Ce fichier n’est pas une sauvegarde de l’application.'));return}
    pendingImport=o;$('#impbox').innerHTML=importBoxHTML()}).catch(()=>toast(tr('ما قدرتش نقرا الملف.','Lecture du fichier impossible.')));return}
  if(t.id==='pc'&&pdraft){pdraft.clientId=t.value;updPay();return}
  if(t.id==='kt'&&kdraft){kdraft.typeId=t.value;const ty=types().find(x=>x.id===t.value);const e2=S.sk[t.value];kdraft.sell=ty?String(ty.price):'';if(e2&&e2.last){kdraft.sw=String(e2.last.sw);kdraft.sh=String(e2.last.sh);kdraft.costM2=String(e2.last.costM2)}$('#kp').value=kdraft.sell;$('#kw').value=kdraft.sw;$('#kh').value=kdraft.sh;$('#kc').value=kdraft.costM2;updKin()}
  if(t.id==='at'&&adraft){adraft.typeId=t.value;updAdj()}
  if(t.id==='bc'&&draft){if(t.value==='__new'){t.value=draft.clientId||'';cdraft={name:'',owner:'',phone:'',debt:'',ret:'bon'};go('cform');return}draft.clientId=t.value;updBon()}
  if(t.dataset&&t.dataset.lf==='typeId'&&draft){const l=draft.lines[+t.dataset.i];if(l.typeId!==t.value){l.typeId=t.value;const ty=types().find(x=>x.id===t.value);if(ty){l.price=ty.price;const p=$('#lp'+t.dataset.i);if(p)p.value=ty.price}updBon()}}
});
function backupFile(){const data={app:'daftar-zujaj',version:2,exportedAt:new Date().toISOString(),docs:LocalDB.dump()};return new File([JSON.stringify(data)],`saddam-backup-${today()}.json`,{type:'application/json'})}
function downloadFile(f){const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function copyText(txt,fallbackSel){
  try{await navigator.clipboard.writeText(txt);toast(tr('تنسخ.','Copié.'));return true}
  catch(_){const f=$(fallbackSel);if(f){f.innerHTML=`<textarea class="copyfall" readonly>${esc(txt)}</textarea>`;const ta=f.firstChild;ta.focus();ta.select()}toast(tr('حدد النص وانسخو.','Sélectionnez le texte et copiez-le.'));return false}
}
document.addEventListener('click',async e=>{
  touch();
  const b=e.target.closest('[data-act]');if(!b)return;

  if(a==='theme'){prefs.theme=b.dataset.v;savePrefs();render();return}
  if(a==='gate-forgot'){gateMode='forgot';gateErr='';renderGate();return}
  if(a==='gate-login'){gateMode='login';gateErr='';renderGate();return}
  if(a==='recovery-ok'){recoveryShown=null;gateMode=null;unlocked=true;touch(true);startApp();return}
  if(a==='lock')return lockNow();
  if(a==='nav-home')return go('home');
  if(a==='nav-clients'){if(b.dataset.f)cfilter=b.dataset.f;return go('clients')}

  if(a==='nav-set')return go('set');

  if(a==='nav-prices'){tdraft=types().map(t=>({...t}));return go('prices')}

  if(a==='new-bon')return startBon(id);
  if(a==='back-bon')return go('bon');
  if(a==='new-pay'){pdraft={clientId:id||'',pick:!id,amount:'',date:today(),note:''};return go('pay')}
  if(a==='add-client'){cdraft={name:'',owner:'',phone:'',debt:''};return go('cform')}
  if(a==='edit-client'){const c=S.clients[id];cdraft={id,name:c.name||'',owner:c.owner||'',phone:c.phone||''};return go('cform')}
  if(a==='new-in'){const t=types()[0],e2=S.sk[t.id];kdraft={typeId:t.id,date:today(),sheets:'',sw:String(e2&&e2.last?e2.last.sw:SHEET0.w),sh:String(e2&&e2.last?e2.last.sh:SHEET0.h),costM2:e2&&e2.last?String(e2.last.costM2):'',sell:String(t.price),supplier:''};return go('kin')}
  if(a==='new-adj'){adraft={typeId:types()[0].id,date:today(),real:'',note:''};return go('kadj')}
  if(a==='add-line'){draft.lines.push(newLine());$('#lines').insertAdjacentHTML('beforeend',lineHTML(draft.lines.at(-1),draft.lines.length-1));document.querySelectorAll('.line-card .x').forEach(x=>x.disabled=draft.lines.length<2);updBon();$('#lw'+(draft.lines.length-1)).focus();return}
  if(a==='rm-line'){draft.lines.splice(+b.dataset.i,1);$('#lines').innerHTML=draft.lines.map(lineHTML).join('');updBon();return}
  if(a==='paid-zero'){draft.paid='0';$('#bp').value='0';updBon();return}
  if(a==='paid-full'){draft.paid=String(bonTotal());$('#bp').value=draft.paid;updBon();return}
  if(a==='pay-full'){const s=S.stats[pdraft.clientId]||{bal:0};pdraft.amount=String(Math.max(0,Math.round(s.bal)));$('#pa').value=pdraft.amount;updPay();return}
  if(a==='add-type'){tdraft.push({id:'t'+Date.now().toString(36),name:'',price:''});const i=tdraft.length-1;$('#tl').insertAdjacentHTML('beforeend',typeRowHTML(tdraft[i],i));document.querySelectorAll('#tl .x').forEach(x=>x.disabled=false);return}
  if(a==='rm-type'){tdraft.splice(+b.dataset.i,1);render();return}
  if(a==='copy')return copyText(releveText(id),'#copyfall');
  if(a==='copy-prompt')return copyText(isFr()?CLAUDE_PROMPT_FR:CLAUDE_PROMPT_AR,'#cprompt');
  if(a==='imp-parse'){imp.rows=parseCSV(imp.text);$('#imp-rows').innerHTML=impRowsHTML();if(imp.rows.length)$('#imp-rows').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='imp-save'){
    const rows=imp.rows.filter(r=>r.on&&String(r.name).trim());if(!rows.length)return toast(tr('ما كاين حتى سطر مختار.','Aucune ligne sélectionnée.'));
    const names=new Map(Object.entries(S.clients).map(([cid,c])=>[normName(c.name),cid]));
    let n=0;
    const ok=await write(async()=>{for(const r of rows){const nm=String(r.name).trim();let cid=names.get(normName(nm));
      if(!cid){const ref=db.collection('clients').doc();await ref.set({name:nm,owner:'',phone:String(r.phone||'').trim(),createdAt:Date.now()});cid=ref.id;names.set(normName(nm),cid)}
      else if(r.phone&&S.clients[cid]&&!S.clients[cid].phone)await db.doc('clients/'+cid).update({phone:String(r.phone).trim()});
      const d=Math.round(num(r.debt));if(d>0)await db.collection('bons').doc().set({clientId:cid,kind:'opening',date:today(),lines:[],total:d,note:r.note?tr('من الكراس · ','Cahier · ')+r.note:tr('من الكراس','Cahier'),createdAt:Date.now()});n++}},null);
    if(ok){toast(tr(`تسجلت ${n} ورشة.`,`${n} clients importés.`));imp=null;cfilter='debt';go('clients')}
    return}
  if(a==='new-code'){const code=newRecovery(),rsalt=randB64();const rhash=await hashPw(code.replace(/\D/g,''),rsalt);
    if(await write(()=>db.doc('auth/main').update({rsalt,rhash}))){$('#newcode').innerHTML=`<div class="code">${code}</div><p class="note">${tr('اكتبو في بلاصة آمنة. ما يبانش مرة أخرى.','Notez-le en lieu sûr. Il ne sera plus affiché.')}</p>`}return}
  if(a==='share-bk'||a==='dl-bk'){
    const f=backupFile();
    if(a==='share-bk'&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:tr('نسخة زجاج صدام','Sauvegarde Vitrerie Saddam')});setLastBackup();toast(tr('تبعثت النسخة.','Sauvegarde envoyée.'));render()}
      catch(err){if(err&&err.name!=='AbortError'){downloadFile(f);setLastBackup();toast(tr('تحمّل الملف.','Fichier téléchargé.'));render()}}
    }else{downloadFile(f);setLastBackup();toast(tr('تحمّل الملف ','Fichier téléchargé : ')+f.name);render()}
    return}
  if(a==='cancel-import'){pendingImport=null;const i=$('#imp');if(i)i.value='';$('#impbox').innerHTML='';return}
  if(a==='do-import'){if(!armed(b))return;const o=pendingImport;
    if(await write(()=>LocalDB.replaceAll(o.docs),tr('رجعت البيانات من النسخة.','Données restaurées.'))){pendingImport=null;go('home')}return}
  if(a==='install'){if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(_){}installEvt=null;render()}return}
  if(a==='save-types'){
    const clean=tdraft.map(t=>({id:t.id,name:String(t.name).trim(),price:num(t.price)})).filter(t=>t.name);
    if(!clean.length||clean.some(t=>t.price<=0))return toast(tr('كل نوع لازم عندو اسم وسعر.','Chaque type doit avoir un nom et un prix.'));
    if(await write(()=>db.doc('settings/main').set({types:clean}),tr('تسجلو الأسعار.','Prix enregistrés.'))){tdraft=clean.map(t=>({...t}));go('set')}
    return}
  if(a==='save-client'){
    const name=String(cdraft.name).trim();if(!name)return toast(tr('اكتب اسم الورشة.','Saisissez le nom.'));
    if(cdraft.id){if(await write(()=>db.doc('clients/'+cdraft.id).update({name,owner:cdraft.owner.trim(),phone:cdraft.phone.trim()}),tr('تسجّل التعديل.','Modifié.')))go('client',{id:cdraft.id});return}
    const ref=db.collection('clients').doc();const debt=num(cdraft.debt);
    const ok=await write(async()=>{await ref.set({name,owner:cdraft.owner.trim(),phone:cdraft.phone.trim(),createdAt:Date.now()});
      if(debt>0)await db.collection('bons').doc().set({clientId:ref.id,kind:'opening',date:today(),lines:[],total:Math.round(debt),note:tr('دين قديم من الكراس','Ancien crédit du cahier'),createdAt:Date.now()})},tr('تزادت الورشة.','Client ajouté.'));
    if(ok){if(cdraft.ret==='bon'&&draft){draft.clientId=ref.id;go('bon')}else go('client',{id:ref.id})}
    return}
  if(a==='save-bon'){
    if(!draft.clientId)return toast(tr('اختار الورشة.','Choisissez le client.'));
    const lines=draft.lines.filter(l=>num(l.w)>0&&num(l.h)>0&&num(l.qty)>0).map(l=>{const ty=types().find(x=>x.id===l.typeId)||{name:'?'};const c=lineCalc(l);return{typeId:l.typeId,type:ty.name,price:num(l.price),w:num(l.w),h:num(l.h),qty:num(l.qty),area:Math.round(c.area*10000)/10000,amount:c.amount}});
    if(!lines.length)return toast(tr('اكتب العرض والطول والعدد على الأقل في سطر واحد.','Saisissez largeur, hauteur et quantité sur au moins une ligne.'));

    const nb=Object.values(S.bons).reduce((m,x)=>Math.max(m,num(x.num)),0)+1;
    const ref=db.collection('bons').doc();const cid=draft.clientId,date=draft.date||today();
    const ok=await write(async()=>{await ref.set({clientId:cid,kind:'sale',num:nb,date,lines,total,note:draft.note.trim(),createdAt:Date.now()});

    if(ok){draft=null;go('client',{id:cid})}
    return}
  if(a==='save-pay'){
    if(!pdraft.clientId)return toast(tr('اختار الورشة.','Choisissez le client.'));

      if(newTypes)await db.doc('settings/main').set({types:newTypes})},newTypes?tr('تسجلت السلعة وتبدل سعر البيع.','Entrée enregistrée, prix de vente mis à jour.'):tr('تسجلت السلعة.','Entrée enregistrée.'));

  if(a==='del-mv'){if(!armed(b))return;await write(()=>db.doc('stock/'+id).delete(),tr('تمسحت.','Supprimé.'));return}

    if(await write(async()=>{for(const p of linked)await db.doc('payments/'+p).delete();await db.doc('bons/'+id).delete()},tr('تمسح البون.','Bon supprimé.')))go('client',{id:cid});return}
  if(a==='del-client'){if(!armed(b))return;
    const bs=Object.keys(S.bons).filter(x=>S.bons[x].clientId===id),ps=Object.keys(S.pays).filter(x=>S.pays[x].clientId===id);
    if(await write(async()=>{for(const p of ps)await db.doc('payments/'+p).delete();for(const x of bs)await db.doc('bons/'+x).delete();await db.doc('clients/'+id).delete()},tr('تمسحت الورشة.','Client supprimé.')))go('clients');return}
});

  catch(e){$('#boot').innerHTML=`<div class="gate-card"><div class="gate-head">${MARK}<b>${tr('زجاج صدام','Vitrerie Saddam')}</b></div><p class="note">${tr('هذا المتصفح ما يخليش التطبيق يسجل البيانات. حلّو في Chrome ولا Safari، وما تستعملش الوضع الخفي.','Ce navigateur ne permet pas d’enregistrer les données. Ouvrez l’application dans Chrome ou Safari, hors navigation privée.')}</p></div>`;return}
  db=LocalDB;dbState='ok';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const asMap=q=>Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));
  db.doc('auth/main').onSnapshot(s=>{S.auth=s.exists?s.data():null;S.ok.a=true;refresh()});
  db.doc('settings/main').onSnapshot(s=>{S.types=s.exists&&Array.isArray(s.data().types)&&s.data().types.length?s.data().types:null;refresh()});
  db.collection('clients').onSnapshot(q=>{S.clients=asMap(q);S.ok.c=true;refresh()});
  db.collection('bons').onSnapshot(q=>{S.bons=asMap(q);S.ok.b=true;refresh()});
  db.collection('payments').onSnapshot(q=>{S.pays=asMap(q);S.ok.p=true;refresh()});
  db.collection('stock').onSnapshot(q=>{S.stock=asMap(q);S.ok.k=true;refresh()});
})();
