<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GG</title>
<meta name="theme-color" content="#f3f4f6">
<meta name="description" content="Gessoum Glass: البيع بالكريدي، ديون الحرفيين، ومخزون الزجاج">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GG">
<link rel="preload" href="IBMPlexSansArabic-Regular.woff2" as="font" type="font/woff2" crossorigin>
<script>
try{var p=JSON.parse(localStorage.getItem('sz-prefs')||'{}');var h=document.documentElement;
if(p.theme==='dark'||p.theme==='light')h.setAttribute('data-theme',p.theme);
if(p.lang==='fr'){h.lang='fr';h.dir='ltr'}}catch(e){}
</script>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";src:url("IBMPlexSansArabic-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("IBMPlexSansArabic-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("IBMPlexSansArabic-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("IBMPlexSansArabic-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
/* Layout: phone-first ledger. Sticky brand bar, one scrolling column, five-tab bottom bar with a raised "new sale" button. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface2:#f6f9f8; --sunk:#e5edeb; --ink:#10201e; --muted:#566865; --faint:#869794; --line:#d9e3e1;
  --accent:#17635e; --accent-2:#0f4b47; --accent-ink:#ffffff; --accent-soft:#dbece8; --edge:#9fd3c7;
  --debt:#b0392d; --debt-soft:#f8e2de; --warn:#8f5d0a; --warn-soft:#f6ebd2; --ok:#22703e; --ok-soft:#dcefe2;
  --shadow:0 1px 2px rgba(16,32,30,.05),0 6px 18px rgba(16,32,30,.06);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* top bar */
.top{position:sticky;top:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.15;display:block}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:4px calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.32rem;margin:0;text-wrap:balance;line-height:1.3}
h3{font-size:.78rem;font-weight:600;color:var(--muted);margin:6px 0 0;letter-spacing:.03em;text-transform:uppercase}
.note{font-size:.85rem;color:var(--muted)}
p.note{margin:0;max-width:60ch}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.hero{background:linear-gradient(160deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:30px;transform:rotate(25deg);background:rgba(255,255,255,.08)}
.hero .lbl{font-size:.82rem;opacity:.85}
.hero .big{font-family:var(--f-body);font-size:2.15rem;font-weight:700;line-height:1.1}
.hero .big small{font-size:1rem;font-weight:500;opacity:.85}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem}
.hero .sub b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.tile .lbl{font-size:.76rem;color:var(--muted)}
.tile .v{font-weight:700;font-size:1.12rem}
.tile .v.ok{color:var(--ok)}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.svc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.svc-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.svc-chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.svc-n{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.svc-n input{width:64px;padding:6px 8px}
.cutbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px}
.cutbox svg{width:100%;height:auto;display:block}
.rc .words{margin:8px 0 0;font-size:11.5px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--ink);box-shadow:var(--shadow);text-align:center;line-height:1.25}
.qa .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qmain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qmain .qa{flex-direction:row;justify-content:flex-start;padding:14px 12px;gap:10px;font-size:.9rem;text-align:start}
.qmain .qa .ib{width:42px;height:42px}
.guide-head{display:flex;gap:12px;align-items:center}.guide-head .ib,.gsec summary .ib{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.guide-head p{margin:2px 0 0}
.glist{display:flex;flex-direction:column;gap:8px}
.gsec{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gsec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:60px}
.gsec summary::-webkit-details-marker{display:none}
.gsec summary b{flex:1;font-weight:600}
.gsec .gchev{color:var(--faint);transform:rotate(90deg);transition:transform .15s}
.gsec[open] .gchev{transform:rotate(-90deg)}
.gsec[open] summary{border-bottom:1px solid var(--line)}
.gbody{padding:12px 16px 16px}
.gsteps{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.gsteps li::marker{color:var(--accent);font-weight:700}
.gtips{margin-top:12px;display:grid;gap:6px}
.gtips div{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-2);border-radius:10px;padding:8px 10px;font-size:.86rem}
.gtips .ic{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.gprint section{break-inside:avoid;margin:10px 0}.gprint h3{font-size:14px;color:#0f4b47;text-transform:none;letter-spacing:0;margin:0 0 4px}.gprint .note{color:#333}.gprint .gtips div{background:#eef5f3;color:#0f4b47}
.hero::after{pointer-events:none}
.hero>*{position:relative;z-index:1}
.eyebtn{flex-shrink:0;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:inherit;display:grid;place-items:center}
.eyebtn .ic{width:22px;height:22px}
.hero .mask{letter-spacing:.12em}
.hero.tap{cursor:pointer}.hero.tap:active{transform:scale(.99)}
.hero .more{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;opacity:.9}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.sec h3{margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:start;width:100%;min-height:58px}
.row:last-child{border-bottom:0}
button.row:active,button.row:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:1rem}
.av.bad{background:var(--debt-soft);color:var(--debt)}
.av.warn{background:var(--warn-soft);color:var(--warn)}
.rleft{display:flex;align-items:center;gap:12px;min-width:0}
.rmain{display:flex;flex-direction:column;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:.78rem;color:var(--muted)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.amt{font-weight:700;white-space:nowrap}
.amt.neg{color:var(--debt)}
.amt.pos{color:var(--ok)}
.chip{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--debt-soft);color:var(--debt)}
.acts{display:flex;gap:6px}
.mini-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent);text-decoration:none}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* chart */
.chart{padding:14px 16px 10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* buttons & forms */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--accent);padding-inline:8px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--debt);border:1px solid var(--debt-soft)}
.btn.danger[data-armed]{background:var(--debt);color:var(--surface)}
.btn.full{width:100%;padding-block:13px}
.btn:disabled{opacity:.55;cursor:default}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{width:100%}
.line-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.lt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.ld{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lu{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.lr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:7px 10px;gap:8px;flex-wrap:wrap}
.lr b{color:var(--ink)}
.avail{font-size:.8rem}
.avail.short{color:var(--debt);font-weight:600}
.x{background:transparent;border:1px solid var(--line);border-radius:11px;width:44px;height:44px;color:var(--muted);font-size:1.1rem}
.totals{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.trow.big{font-size:1.2rem;font-weight:700}
.quickpay{display:flex;gap:6px;flex-wrap:wrap}
.quickpay button{background:var(--sunk);border:0;border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ledger rows */
.led{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.le{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.le:last-child{border-bottom:0}
button.le:hover{background:var(--surface2)}
.le .what{font-weight:600}
.le .d{font-size:.78rem;color:var(--muted)}
.le .run{font-size:.78rem;color:var(--muted);text-align:end}
.le .a{text-align:end;font-weight:700}
.le.pay .a{color:var(--ok)}
.le .del{grid-column:2;grid-row:2;justify-self:end;padding:3px 10px;font-size:.75rem}
.le .le-acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.le .le-acts .btn{padding:4px 12px;font-size:.76rem;min-height:32px}
.rc tr.hd td{border-bottom:0}
.rc tr.sub td{padding-top:0;font-size:10.5px;color:#444}
.rc .sumrow{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0;font-size:11.5px}
#swipe-ind{position:fixed;top:45%;z-index:60;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .15s}
#swipe-ind svg{width:22px;height:22px}
.ctool{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px;box-shadow:var(--shadow)}
.ctool .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border:0;background:none;border-radius:12px;color:var(--accent);font:inherit;font-size:.72rem;font-weight:600;text-decoration:none;min-height:58px;cursor:pointer}
.ctool .tb:hover,.ctool .tb:active{background:var(--accent-soft)}
.ctool .tb .ic{width:22px;height:22px}
.ctool .tb.dg{color:var(--debt)}
.tapcard{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tapcard:active{transform:scale(.985)}
.tapcard .dots{position:absolute;top:10px;inset-inline-end:12px;color:var(--faint);font-size:1.2rem;line-height:1;letter-spacing:1px}
.balbox.tapcard{padding-top:26px}
.popmenu{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;min-width:220px;display:grid;gap:2px;animation:pmin .14s ease-out}
@keyframes pmin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.popmenu button{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;background:none;border-radius:10px;font:inherit;font-weight:600;color:var(--ink);text-align:start;min-height:46px;cursor:pointer}
.popmenu button:hover,.popmenu button:active{background:var(--surface2)}
.popmenu button .ic{color:var(--accent)}
.popmenu button.dg,.popmenu button.dg .ic{color:var(--debt)}
.dnote{display:flex;gap:6px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.86rem;white-space:pre-wrap;width:100%}
.brandbtn{all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;border-radius:12px;-webkit-tap-highlight-color:transparent}
.brandbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.notecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;box-shadow:var(--shadow)}
.notecard.done{opacity:.6}
.notecard .nh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.notecard .nn{font-weight:700;font-size:1.02rem}
.notecard .na{font-weight:800;color:var(--debt);white-space:nowrap}
.notecard .nt{white-space:pre-wrap;color:var(--ink);font-size:.9rem}
.notecard .nacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.notecard .nacts .btn{padding:5px 12px;font-size:.78rem;min-height:34px}

let SNDC=null;
function sndCtx(){try{if(!SNDC)SNDC=new (window.AudioContext||window.webkitAudioContext)();if(SNDC.state==='suspended')SNDC.resume();return SNDC}catch(_){return null}}
document.addEventListener('pointerdown',()=>{if(prefs.sound!==false)sndCtx()},{passive:true});
function sTone(c,f,t0,dur,type,vol,f2){const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05)}
function sound(k){if(prefs.sound===false)return;const c=sndCtx();if(!c)return;try{
  if(k==='paid'){sTone(c,1318.5,0,0.35,'triangle',0.25);sTone(c,2637,0,0.25,'sine',0.08);sTone(c,1760,0.11,0.7,'triangle',0.28);sTone(c,3520,0.11,0.5,'sine',0.08);for(let i=0;i<6;i++)sTone(c,3200+Math.random()*1800,0.2+i*0.045,0.12,'sine',0.06)}
  else if(k==='debt'){sTone(c,392,0,0.35,'triangle',0.25);sTone(c,311.1,0.3,0.7,'triangle',0.25)}
  else if(k==='add'){sTone(c,784,0,0.18,'sine',0.22,1046.5);sTone(c,1174.7,0.12,0.45,'sine',0.22);sTone(c,2349.3,0.12,0.3,'sine',0.05)}
}catch(_){}}
const isFr=()=>prefs.lang==='fr';
const tr=(a,f)=>isFr()?f:a;
function applyPrefs(){
  const h=document.documentElement;h.lang=prefs.lang;h.dir=isFr()?'ltr':'rtl';
  if(prefs.theme==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',prefs.theme);
  const dark=prefs.theme==='dark'||(prefs.theme==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0b1111':'#f3f4f6';
  document.title='Gessoum Glass';
}

function priceOf(kind,id,mode,clientId,u){
  const c=mode==='walk'?null:S.clients[clientId];let base;
  if(kind==='glass'){const t=types().find(x=>x.id===id);if(!t)return 0;
    if(mode==='walk')return num(t.priceW)||num(t.price);
    const sp=c&&c.sp&&num(c.sp[id]);if(sp>0)return sp;base=num(t.price)}
  else{const a=S.arts[id];if(!a)return 0;const n=artFactor(a,u);
    if(mode==='walk'){if(u==='pack'&&num(a.packPriceW)>0)return num(a.packPriceW);return (num(a.priceW)||num(a.price))*n}
    const sp=c&&c.sp&&num(c.sp['a:'+id]);if(sp>0)return sp*n;
    base=u==='pack'&&num(a.packPrice)>0?num(a.packPrice):num(a.price)*n}
  const d=c?num(c.disc):0;return d>0?Math.round(base*(1-d/100)):base;
}
function artCostAt(id,date){let best=null;for(const m of Object.values(S.amv)){if(m.kind!=='in'||m.articleId!==id||num(m.qty)<=0)continue;if(date&&m.date>date)continue;if(!best||m.date>best.date||(m.date===best.date&&(m.createdAt||0)>(best.createdAt||0)))best=m}
  if(best)return num(best.unitCost);const a=S.arts[id];return a&&num(a.cost)>0?num(a.cost):null}

/* تأكيد بكلمة السر تاع الحساب (للحذف) */
function askPw({title,body,ok,safe}){
  return new Promise(res=>{const m=$('#modal');
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><span class="sico ${safe?'info':''}">${ic(safe?'eye':'lock')}</span><h2 id="mt">${title}</h2><div class="note">${body||''}</div>
    <div class="field" style="margin-top:12px"><label for="pw-c">${tr('كلمة سر الحساب','Mot de passe du compte')}</label><input id="pw-c" type="password" autocomplete="current-password"></div><p class="err" id="pw-e"></p>
    <div class="actions"><button class="btn line" data-m="0">${tr('رجوع','Retour')}</button><button class="btn ${safe?'':'dangerfill'}" data-m="1">${ok}</button></div></div>`;
    m.hidden=false;setTimeout(()=>{const i=$('#pw-c');if(i)i.focus()},30);
    const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;m.onkeydown=null;res(v)};
    const tryOk=async()=>{const i=$('#pw-c'),e=$('#pw-e');const pw=i?i.value:'';if(!pw){e.textContent=tr('اكتب كلمة السر.','Saisissez le mot de passe.');return}

/* ====================== storage on the phone (IndexedDB) ====================== */
const LocalDB=(()=>{
  let idb=null,hook=null,ehook=null;const mem=new Map();const listeners=new Set();
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const colOf=p=>p.slice(0,p.lastIndexOf('/'));
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open('daftar-zujaj',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
  async function load(){idb=await open();await new Promise((res,rej)=>{const rq=idb.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
  function tx(fn){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=()=>res();const bad=()=>rej({code:t.error&&t.error.name==='QuotaExceededError'?'quota_exceeded':'unavailable',message:String(t.error)});t.onerror=bad;t.onabort=bad})}
  const docSnap=p=>{const d=mem.get(p);return{id:p.slice(p.lastIndexOf('/')+1),exists:d!==undefined,data:()=>d}};
  const colSnap=c=>{const docs=[];for(const [k,v] of mem)if(colOf(k)===c)docs.push({id:k.slice(k.lastIndexOf('/')+1),exists:true,data:()=>v});return{docs,size:docs.length,empty:!docs.length}};
  function emit(paths){const cols=new Set(paths.map(colOf));for(const l of listeners){if(l.kind==='doc'&&paths.includes(l.path))l.fn(docSnap(l.path));if(l.kind==='col'&&cols.has(l.path))l.fn(colSnap(l.path))}}
  function doc(p){return{id:p.slice(p.lastIndexOf('/')+1),path:p,
    async set(d){const old=mem.get(p);const v=JSON.parse(JSON.stringify(d));await tx(s=>s.put(v,p));mem.set(p,v);emit([p]);hook&&hook([p]);ehook&&ehook(p,old,v)},
    async update(d){const cur=mem.get(p);if(!cur)throw{code:'invalid_argument'};const v={...cur,...JSON.parse(JSON.stringify(d))};await tx(s=>s.put(v,p));mem.set(p,v);emit([p]);hook&&hook([p]);ehook&&ehook(p,cur,v)},
    async delete(){const old=mem.get(p);await tx(s=>s.delete(p));mem.delete(p);emit([p]);hook&&hook([p]);ehook&&old!==undefined&&ehook(p,old,undefined)},
    async get(){return docSnap(p)},
    onSnapshot(fn){const l={kind:'doc',path:p,fn};listeners.add(l);setTimeout(()=>fn(docSnap(p)));return()=>listeners.delete(l)}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||rid())),onSnapshot(fn){const l={kind:'col',path:c,fn};listeners.add(l);setTimeout(()=>fn(colSnap(c)));return()=>listeners.delete(l)}}}
  function dump(){const o={};for(const [k,v] of mem)if(!k.startsWith('__'))o[k]=v;return o}
  async function applyRemote(list){await tx(s=>{for(const [k,v] of list){if(v===null)s.delete(k);else s.put(v,k)}});for(const [k,v] of list){if(v===null)mem.delete(k);else mem.set(k,v)}emit(list.map(x=>x[0]))}
  const keys=()=>[...mem.keys()].filter(k=>!k.startsWith('__'));
  const setHook=fn=>{hook=fn};const setEvtHook=fn=>{ehook=fn};
  async function replaceAll(obj){const old=[...mem.keys()];await tx(s=>{s.clear();for(const k in obj)s.put(obj[k],k)});mem.clear();for(const k in obj)mem.set(k,obj[k]);
    emit([...new Set([...old,...Object.keys(obj),'settings/main','clients/x','bons/x','payments/x','stock/x','auth/main'])])}
  const raw=p=>{const v=mem.get(p);return v===undefined?undefined:JSON.parse(JSON.stringify(v))};
  return{load,doc,collection,dump,replaceAll,raw,applyRemote,keys,setHook,setEvtHook};
})();

function loaded(){return S.ok.c&&S.ok.b&&S.ok.p&&S.ok.k}
function compute(){
  const st={};
  for(const id in S.clients)st[id]={sales:0,paid:0,bal:0,lastPay:null,oldestBon:null,lastAct:null};
  for(const id in S.bons){const b=S.bons[id],s=st[b.clientId];if(!s)continue;s.sales+=num(b.total);if(!s.oldestBon||b.date<s.oldestBon)s.oldestBon=b.date;if(!s.lastAct||b.date>s.lastAct)s.lastAct=b.date}
  for(const id in S.pays){const p=S.pays[id],s=st[p.clientId];if(!s)continue;s.paid+=num(p.amount);if(!s.lastPay||p.date>s.lastPay)s.lastPay=p.date;if(!s.lastAct||p.date>s.lastAct)s.lastAct=p.date}
  for(const id in st){const s=st[id];s.bal=s.sales-s.paid;const ref=s.lastPay||s.oldestBon;s.age=s.bal>0&&ref?daysSince(ref):0}
  S.stats=st;
  const rem={},byC={};for(const id in S.bons){const b=S.bons[id];if(b.walkin||!b.clientId)continue;(byC[b.clientId]=byC[b.clientId]||[]).push([id,b])}
  for(const cid in byC){let credit=st[cid]?st[cid].paid:0;const sales=[];for(const [id,b] of byC[cid]){if(num(b.total)<0)credit+=-num(b.total);else sales.push([id,b])}
    sales.sort((a,b)=>a[1].date<b[1].date?-1:a[1].date>b[1].date?1:(a[1].createdAt||0)-(b[1].createdAt||0));
    for(const [id,b] of sales){const t=num(b.total),u=Math.min(t,credit);credit-=u;rem[id]=t-u}}
  S.bonRem=rem;
  const ss={};for(const id in S.sups){const x=S.sups[id];ss[id]={buy:num(x.opening),paid:0,bal:0,last:null}}
  for(const m of Object.values(S.stock)){if(m.kind!=='in'||!m.supplierId||!ss[m.supplierId])continue;const x=ss[m.supplierId];x.buy+=num(m.cost);x.paid+=num(m.paid);if(!x.last||m.date>x.last)x.last=m.date}
  for(const m of Object.values(S.amv)){if(m.kind!=='in'||!m.supplierId||!ss[m.supplierId])continue;const x=ss[m.supplierId];x.buy+=num(m.cost);x.paid+=num(m.paid);if(!x.last||m.date>x.last)x.last=m.date}
  for(const p of Object.values(S.spays)){const x=ss[p.supplierId];if(x)x.paid+=num(p.amount)}
  for(const id in ss)ss[id].bal=ss[id].buy-ss[id].paid;S.sstats=ss;
  const dm={},td=today();for(const id in S.bons){const b=S.bons[id];if(!b.due||b.walkin||!b.clientId||b.due>td)continue;const x=st[b.clientId];if(!x||x.bal<=0)continue;if(!dm[b.clientId]||b.due<dm[b.clientId])dm[b.clientId]=b.due}S.dueMap=dm;
  const k={},mo=today().slice(0,7);
  const ent=(tid,name)=>k[tid]||(k[tid]={name,inA:0,outA:0,adjA:0,monthOut:0,last:null,bal:0});
  for(const t of types())ent(t.id,t.name);
  const mv=Object.values(S.stock).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const m of mv){const e=ent(m.typeId,m.type);if(m.kind==='in'){e.inA+=num(m.area);e.last=m}else e.adjA+=num(m.area)}
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;
    if(b.kind==='return'){if(b.restock)for(const l of b.lines||[]){if(l.lk==='art')continue;const e=ent(l.typeId,l.type);e.outA-=num(l.area)}continue}
    for(const l of b.lines||[]){if(l.lk==='art')continue;const e=ent(l.typeId,l.type);e.outA+=num(l.area);if(b.date&&b.date.slice(0,7)===mo)e.monthOut+=num(l.area)}}
  for(const id in k){const e=k[id];e.bal=e.inA+e.adjA-e.outA;e.sheet=e.last?num(e.last.sw)*num(e.last.sh)/10000:null}
  S.sk=k;
  const ak={};const aent=id=>ak[id]||(ak[id]={inQ:0,adjQ:0,outQ:0,monthOut:0,bal:0,last:null});
  for(const id in S.arts)aent(id);
  for(const m of Object.values(S.amv)){const e=aent(m.articleId);if(m.kind==='in'){e.inQ+=num(m.qty);if(!e.last||m.date>e.last.date)e.last=m}else e.adjQ+=num(m.qty)}
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;for(const l of b.lines||[]){if(l.lk!=='art')continue;const e=aent(l.articleId),q=num(l.baseQty||l.qty);
    if(b.kind==='return'){if(b.restock)e.outQ-=q}else{e.outQ+=q;if(b.date&&b.date.slice(0,7)===mo)e.monthOut+=q}}}
  for(const id in ak){const e=ak[id];e.bal=e.inQ+e.adjQ-e.outQ}
  S.ak=ak;
}
function artState(id){const a=S.arts[id],e=S.ak[id]||{bal:0,inQ:0,adjQ:0};if(!artTracked(a))return{cls:'',chip:''};
  if(!e.inQ&&!e.adjQ)return{cls:'',chip:`<span class="chip bad">${tr('غير متوفر','Non disponible')}</span>`,none:true};
  if(e.bal<=0.0001)return{cls:'out',chip:`<span class="chip bad">${tr('غير متوفر','Non disponible')}</span>`,alert:true};
  if(num(a.alert)>0&&e.bal<=num(a.alert))return{cls:'low',chip:`<span class="chip warn">${tr('يوشك على النفاد','Stock bas')}</span>`,alert:true};
  return{cls:'',chip:`<span class="chip ok">${tr('متوفر','Disponible')}</span>`}}
function stockState(e){
  if(!e.inA&&!e.adjA)return{cls:'out',chip:`<span class="chip bad">${tr('غير متوفر','Non disponible')}</span>`,tracked:false};
  if(e.bal<=0.005)return{cls:'out',chip:`<span class="chip bad">${tr('غير متوفر','Non disponible')}</span>`,tracked:true};
  if(e.sheet&&e.bal<e.sheet)return{cls:'low',chip:`<span class="chip warn">${tr('أقل من لوح','Moins d’une plaque')}</span>`,tracked:true};
  return{cls:'',chip:`<span class="chip ok">${tr('متوفر','Disponible')}</span>`,tracked:true};
}
function ageChip(s){
  if(!s)return'';
  if(s.bal<=0)return `<span class="chip ok">${tr('مسدَّد','Soldé')}</span>`;
  if(!s.lastPay&&!s.oldestBon)return'';
  const d=s.age,cls=d>60?'bad':d>30?'warn':'';
  return `<span class="chip ${cls}">${s.lastPay?tr(`آخر دفع منذ ${d} يوم`,`Dernier paiement il y a ${d} j`):tr(`دون دفع منذ ${d} يوم`,`Aucun paiement depuis ${d} j`)}</span>`;
}

  if(c==='quota_exceeded')return tr('ذاكرة الهاتف ممتلئة. أفرغ بعض المساحة وأعد المحاولة.','Mémoire du téléphone pleine. Libérez de l’espace et réessayez.');

async function write(fn,okMsg){
  if(!db){toast(tr('التطبيق قيد التحميل.','Chargement en cours.'));return false}
  if(busy)return false;busy=true;
  try{await fn();if(okMsg)toast(okMsg);return true}

}

const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function randB64(n=16){const u=new Uint8Array(n);crypto.getRandomValues(u);return b64e(u)}
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(salt),iterations:150000},k,256);return b64e(new Uint8Array(bits))}
function newRecovery(){const u=new Uint32Array(3);crypto.getRandomValues(u);return [u[0]%10000,u[1]%10000,u[2]%10000].map(x=>String(x).padStart(4,'0')).join('-')}
const normUser=u=>String(u||'').trim().toLowerCase();
const SESS='sz-sess';
function sessionValid(){
  if(prefs.lock===0)return unlocked;
  if(unlocked){const last=lastActive();return !last||Date.now()-last<prefs.lock*60000}
  const last=lastActive();return !!last&&Date.now()-last<prefs.lock*60000;
}
function lastActive(){try{return +localStorage.getItem(SESS)||0}catch(_){return 0}}
function touch(force){if(!unlocked||prefs.lock===0)return;const n=Date.now();if(!force&&n-(touch.t||0)<15000)return;touch.t=n;try{localStorage.setItem(SESS,String(n))}catch(_){}}
function endSession(){unlocked=false;try{localStorage.removeItem(SESS)}catch(_){}}
function failState(){try{return JSON.parse(localStorage.getItem('sz-fail')||'{"n":0,"until":0}')}catch(_){return{n:0,until:0}}}
function setFail(o){try{localStorage.setItem('sz-fail',JSON.stringify(o))}catch(_){}}

function setErr(m){gateErr=m;const e=$('#g-err');if(e)e.textContent=m}
async function onGateSubmit(form){
  const v=id=>{const el=$('#'+id);return el?el.value:''};
  if(busy)return;
  if(form==='setup'){
    const name=v('g-name').trim()||tr('صدام','Saddam'),user=normUser(v('g-user')),p1=v('g-pass'),p2=v('g-pass2');
    if(!user)return setErr(tr('اكتب اسم المستخدم.','Saisissez un nom d’utilisateur.'));
    if(p1.length<4)return setErr(tr('يجب أن تتكون كلمة السر من 4 أحرف على الأقل.','Le mot de passe doit faire au moins 4 caractères.'));
    if(p1!==p2)return setErr(tr('كلمتا السر غير متطابقتين.','Les mots de passe ne correspondent pas.'));
    const salt=randB64(),rsalt=randB64(),code=newRecovery();
    const hash=await hashPw(p1,salt),rhash=await hashPw(code.replace(/\D/g,''),rsalt);
    recoveryShown=code;gateMode='recovery';gateErr='';
    if(!await write(()=>db.doc('auth/main').set({name,user,salt,hash,rsalt,rhash,iter:150000,createdAt:Date.now()}))){gateMode='setup';recoveryShown=null}
    renderGate();return}
  if(form==='cloudlogin'){
    const email=v('g-email').trim(),pw=v('g-cpw');if(!email||pw.length<6)return setErr(tr('اكتب الإيميل وكلمة السر.','Saisissez l’e-mail et le mot de passe.'));
    setErr(tr('جاري الاسترجاع…','Récupération…'));
    try{const r=await cloudConnect(email,pw,false);gateErr='';gateMode=null;
      if(r==='pulled'){toast(tr('تم استرجاع البيانات. ادخل بكلمة سر التطبيق.','Données récupérées. Connectez-vous.'))}
      else toast(tr('لا توجد بيانات في هذا الحساب بعد.','Aucune donnée dans ce compte.'));
      render()}catch(e){setErr(cloudErr(e))}
    return}
  if(form==='login'){
    const f=failState();if(f.until>Date.now())return setErr(tr(`محاولات كثيرة. انتظر ${Math.ceil((f.until-Date.now())/1000)} ثانية.`,`Trop d’essais. Attendez ${Math.ceil((f.until-Date.now())/1000)} s.`));
    const a=S.auth,user=normUser(v('g-user')),pw=v('g-pass');
    let who=null;if(user===a.user&&await hashPw(pw,a.salt)===a.hash)who='main';else{const st=(a.staff||[]).find(x=>normUser(x.user)===user);if(st&&await hashPw(pw,st.salt)===st.hash)who=st.id}
    if(who){setWho(who);gateForcePw=false;setFail({n:0,until:0});unlocked=true;gateErr='';touch(true);gateMode=null;startApp();return}
    const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});
    $('#g-pass').value='';return setErr(n>=5?tr('5 محاولات خاطئة. انتظر 30 ثانية.','5 essais erronés. Attendez 30 s.'):tr('اسم المستخدم أو كلمة السر غير صحيحة.','Nom d’utilisateur ou mot de passe incorrect.'))}
  if(form==='quick'){const q=quickGet();if(!q){gateMode='login';return renderGate()}
    const f=failState();if(f.until>Date.now())return setErr(tr(`محاولات كثيرة. انتظر ${Math.ceil((f.until-Date.now())/1000)} ثانية.`,`Trop d’essais. Attendez ${Math.ceil((f.until-Date.now())/1000)} s.`));
    if(await hashPw(v('g-pin'),q.salt)===q.hash){setWho(q.who);setFail({n:0,until:0});unlocked=true;gateErr='';touch(true);gateMode=null;startApp();return}
    const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});const pi=$('#g-pin');if(pi)pi.value='';
    return setErr(n>=5?tr('5 محاولات خاطئة. انتظر 30 ثانية.','5 essais erronés. Attendez 30 s.'):tr('الرمز غير صحيح.','Code incorrect.'))}
  if(form==='forgot'){
    const a=S.auth,code=v('g-code').replace(/\D/g,''),p1=v('g-pass'),p2=v('g-pass2');
    const f=failState();if(f.until>Date.now())return setErr(tr('محاولات كثيرة. انتظر قليلاً.','Trop d’essais. Patientez.'));
    if(await hashPw(code,a.rsalt)!==a.rhash){const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});return setErr(tr('رمز الاسترجاع غير صحيح.','Code de secours incorrect.'))}
    if(p1.length<4)return setErr(tr('يجب أن تتكون كلمة السر من 4 أحرف على الأقل.','Le mot de passe doit faire au moins 4 caractères.'));
    if(p1!==p2)return setErr(tr('كلمتا السر غير متطابقتين.','Les mots de passe ne correspondent pas.'));
    const salt=randB64();const hash=await hashPw(p1,salt);
    if(await write(()=>db.doc('auth/main').update({salt,hash}),tr('تم تغيير كلمة السر.','Mot de passe changé.'))){setWho('main');setFail({n:0,until:0});unlocked=true;touch(true);gateMode=null;gateErr='';startApp()}
  }
}
function decideGate(){
  if(!S.ok.a)return 'loading';
  if(gateMode==='recovery'||gateMode==='forgot'||gateMode==='cloudlogin')return gateMode;
  if(!S.auth)return 'setup';
  if(curWho!=='main'&&!staffOf(curWho)){setWho('main');endSession()}
  if(!sessionValid()){unlocked=false;return quickGet()&&!gateForcePw?'quick':'login'}
  unlocked=true;return null;
}

function csvDownload(name,rows){
  const esc2=v=>{const x=String(v??'');return /[";\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const txt='\ufeff'+rows.map(r=>r.map(esc2).join(';')).join('\r\n');
  downloadFile(new File([txt],name,{type:'text/csv'}));toast(tr('تم تنزيل الملف ','Fichier téléchargé : ')+name);
}
function printHTML(html,paper){
  const el=$('#print');el.innerHTML=html;document.body.classList.add('printing');
  let pg=document.getElementById('pgsz');if(!pg){pg=document.createElement('style');pg.id='pgsz';document.head.appendChild(pg)}
  pg.textContent=paper==='tk'?'@media print{@page{size:80mm auto;margin:2mm}}':'';
  const done=()=>{document.body.classList.remove('printing');el.innerHTML='';pg.textContent='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print()}catch(_){done();toast(tr('الطباعة غير متاحة في هذا المتصفح.','Impression indisponible dans ce navigateur.'))}},60);
}

 ar:{t:'فاتورة حرفي (بالكريدي)',i:'الفاتورة تُسجّل ما أخذه الحرفي، تُخصم من المخزون، وتُضاف إلى دينه.',
  s:['اضغط «فاتورة حرفي» واختر الحرفي والتاريخ.','اختر نوع الزجاج، ثم اكتب العرض والطول بالسنتيم والعدد. المساحة والمبلغ يُحسبان وحدهم.','«+ زجاج» لسطر آخر، و«+ سلعة / خدمة» للسيليكون، الجوان… وإذا السلعة ما كانتش، اختار «＋ سلعة جديدة» وزيدها من هنا.','الإيقونات تحت: «دفع الآن» إذا خلّص شوية (الباقي يدخل في الدين)، «تخفيض»، «موعد التسديد» (التطبيق يرنّ كي يجي)، «ملاحظة»، و«التاريخ» إذا ماشي اليوم.','«حفظ الفاتورة». من صفحة الفاتورة تقدر تطبعها، ترسلها بالواتساب، تعدّلها أو تسجّل مرتجعاً.'],
  p:['إذا تجاوز الحرفي سقف الدين، ينبّهك التطبيق قبل الحفظ.','إذا الزجاج ما يكفيش في المخزون، ما يخليكش تحفظ: أدخل السلعة أولاً.','«سجل الفواتير» فيه كل الفواتير مع فلاتر (اليوم، الشهر، قيد التحضير…).','المرتجع: من صفحة الفاتورة ← «مرتجع». يُخصم من دين الحرفي، وتختار هل الزجاج يرجع للمخزون ولا تالف.']},
 fr:{t:'Facture atelier (à crédit)',i:'La facture enregistre ce que l’atelier a pris, sort du stock et s’ajoute à son crédit.',
  s:['Touchez « Vente atelier », choisissez l’atelier et la date.','Choisissez le verre, puis largeur et hauteur en cm et la quantité. Surface et montant se calculent seuls.','« + Verre » pour une autre ligne, « + Article / service » pour silicone, joint… S’il manque, choisissez « ＋ Nouvel article ».','Les icônes en bas : « Payé » (le reste va au crédit), « Remise », « Échéance » (l’application sonne), « Note », et « Date » si ce n’est pas aujourd’hui.','« Enregistrer ». Depuis la facture : imprimer, envoyer par WhatsApp, modifier ou faire un retour.'],
  p:['Si l’atelier dépasse son plafond, l’application vous prévient avant d’enregistrer.','Si le verre manque en stock, la vente est bloquée : faites d’abord une entrée stock.','« Journal des factures » liste toutes les factures avec filtres.','Retour : depuis la facture ← « Retour ». Il est déduit du crédit ; le verre revient en stock ou part en casse.']}},
{id:'walk',icon:'tag',views:[],
 ar:{t:'بيع لزبون عادي (نقداً)',i:'للزبائن العابرين (مرآة، طاولة، تسريحة…). يُخصم من المخزون ويدخل في الصندوق، ولا يدخل في حسابات الحرفيين.',
  s:['اضغط «بيع لزبون عادي».','أضف الأسطر كيما فاتورة الحرفي.','بلا ما تدير والو، تتسجّل مدفوعة كاملة.','إذا بقي عليه شيء: «دفع جزء» واكتب شحال دفع، واكتب اسمو وهاتفو فوق باش يبان في الديون.'],
  p:['هذه المبيعات تجدها في «الزبائن» ← تبويب «زبائن عاديون».']},
 fr:{t:'Vente comptoir (comptant)',i:'Pour les clients de passage (miroir, table, coiffeuse…). Sort du stock, entre en caisse, hors comptes des ateliers.',
  s:['Touchez « Vente comptoir ».','Ajoutez les lignes comme une facture atelier.','Par défaut, la vente est payée en totalité.','S’il reste un montant dû : « Acompte », puis nom et téléphone en haut.'],
  p:['Ces ventes sont dans « Clients » ← onglet comptoir.']}},
{id:'quote',icon:'doc',views:['quotes','quoteview'],
 ar:{t:'عرض السعر (Devis)',i:'عرض السعر لا يُخصم من المخزون ولا يُسجَّل كدين. تعطيه للزبون قبل ما يوافق.',
  s:['من «كل الأدوات» ← «عروض الأسعار» ← عرض جديد.','املأه كيما الفاتورة واحفظه، ثم اطبعه أو أرسله بالواتساب.','كي يوافق الزبون: افتح العرض ← «تحويل إلى فاتورة».'],
  p:[]},
 fr:{t:'Devis',i:'Le devis ne sort pas du stock et ne crée pas de crédit. On le donne avant accord du client.',
  s:['« Tous les outils » ← « Devis » ← nouveau devis.','Remplissez-le comme une facture, enregistrez, imprimez ou envoyez par WhatsApp.','Quand le client accepte : ouvrez le devis ← « Transformer en facture ».'],
  p:[]}},
{id:'clients',icon:'users',views:['clients','client','pay','cform','stmt','climit','cprice','cdebt','odebt','dnote'],
 ar:{t:'الحرفيون والفارسمو',i:'كل حرفي عنده صفحة فيها دينه، فواتيره ودفعاته، بالترتيب.',
  s:['حرفي جديد: «الزبائن» ← «إضافة». إذا عليه دين قديم من الكراس، اكتبه عند التسجيل.','الفارسمو: من صفحة الحرفي ← «فارسمو»، أو من الرئيسية. اكتب المبلغ وطريقة الدفع (نقداً، شيك، تحويل، CCP).','من فوق صفحة الحرفي: اتصال، تذكير بالواتساب، كشف الحساب PDF، تعديل.','زر «⋯ المزيد»: تصفير الحساب أو حذف الحرفي (يسقسيك قبل).'],
  p:['سقف الدين: إذا تجاوزه الحرفي ينبّهك التطبيق في الفاتورة.','أسعار خاصة: سعر مختلف لحرفي واحد بدون ما يتبدل السعر العادي.','«يدفع بانتظام / متوسط / يتماطل» يُحسب وحده من دفعاته ومواعيده.']},
 fr:{t:'Ateliers et versements',i:'Chaque atelier a sa page : crédit, factures et paiements, dans l’ordre.',
  s:['Nouvel atelier : « Clients » ← « Ajouter ». S’il a un ancien crédit du cahier, saisissez-le à la création.','Versement : page de l’atelier ← « Versement », ou depuis l’accueil. Montant et mode (espèces, chèque, virement, CCP).','En haut de la page : appeler, rappel WhatsApp, relevé PDF, modifier.','Bouton « ⋯ Plus » : remise à zéro ou suppression (avec confirmation).'],
  p:['Plafond : l’application prévient quand l’atelier le dépasse.','Prix spéciaux : un prix différent pour un seul atelier, sans changer le prix normal.','« Régulier / moyen / retardataire » se calcule seul à partir des paiements.']}},
{id:'collect',icon:'target',views:['collect'],
 ar:{t:'جولة التحصيل',i:'قائمة اليوم: شكون لازم تعيطلو، بالترتيب.',
  s:['الترتيب: اللي حلّ موعدهم، ثم اللي تجاوزوا السقف، ثم المتأخرين أكثر من 30 يوم.','اضغط الهاتف ولا الواتساب: الحرفي يتعلّم «تم» وحده.','كي تكمل القائمة، الجولة تخلص لليوم.'],
  p:[]},
 fr:{t:'Tournée de recouvrement',i:'La liste du jour : qui relancer, dans l’ordre.',
  s:['Ordre : échéances arrivées, puis plafonds dépassés, puis retards de plus de 30 jours.','Touchez téléphone ou WhatsApp : l’atelier est marqué « fait ».','Quand la liste est vide, la tournée du jour est terminée.'],
  p:[]}},
{id:'stock',icon:'box',views:['stock','kin','kadj','art','aform','ain','aadj'],
 ar:{t:'المخزون',i:'كل فاتورة بيع تُخصم مساحتها من المخزون وحدها. أنت تسجّل غير اللي يدخل والكسر.',
  s:['«إدخال سلعة»: نوع الزجاج، عدد الألواح ومقاسها، وسعر المتر. يمكن ربطه بمورّد.','«تعديل الجرد»: قيس الزجاج الموجود فعلاً واكتبه. الفرق يتسجّل (كسر، بقايا قص).','تبويب «السلع والخدمات»: السيليكون، الجوان، الإكسسوارات… مع تنبيه كي توشك على النفاد.','تبويب «البقايا»: قطع الزجاج الباقية من القص، تُستعمل أولاً في مخطط القص.'],
  p:['الأحمر = غير متوفر، البرتقالي = قليل.','«طلبية للمورّد» تحضّرلك اللي ناقص وترسلها بالواتساب.']},
 fr:{t:'Stock',i:'Chaque vente déduit sa surface du stock automatiquement. Vous saisissez seulement les entrées et la casse.',
  s:['« Entrée stock » : type de verre, nombre et format des plaques, prix au m². Lien possible avec un fournisseur.','« Ajuster l’inventaire » : mesurez le verre réel et saisissez-le. L’écart est enregistré (casse, chutes).','Onglet « Articles et services » : silicone, joints, accessoires… avec alerte avant rupture.','Onglet « Chutes » : morceaux restants, utilisés en premier dans le plan de découpe.'],
  p:['Rouge = épuisé, orange = bas.','« Commander » prépare ce qui manque et l’envoie par WhatsApp.']}},
{id:'sups',icon:'truck',views:['sups','sup','sform','spay','pos','poform','poview'],adm:true,
 ar:{t:'الموردون وطلبيات الشراء',i:'شكون تشري منهم، شحال عليك ليهم، وواش طلبت.',
  s:['أضف المورّد من «الموردون»، أو اختره عند إدخال السلعة.','كل إدخال سلعة مربوط بمورّد يزيد دينك عنده، وكل دفع ينقصه.','«طلبيات الشراء»: اكتب واش تحتاج وأرسلها بالواتساب. كي توصل السلعة اضغط «وصلت السلعة» باش تدخل للمخزون سطراً سطراً.'],
  p:[]},
 fr:{t:'Fournisseurs et commandes',i:'Chez qui vous achetez, combien vous leur devez, et ce que vous avez commandé.',
  s:['Ajoutez le fournisseur dans « Fournisseurs », ou choisissez-le à l’entrée stock.','Chaque entrée liée à un fournisseur augmente votre dette, chaque paiement la réduit.','« Bons de commande » : listez vos besoins et envoyez par WhatsApp. À l’arrivée, « Marchandise reçue » l’entre en stock ligne par ligne.'],
  p:[]}},
{id:'cash',icon:'wallet',views:['cash','exp','expview','close'],
 ar:{t:'الصندوق والمصاريف',i:'شحال دخل وشحال خرج في كل يوم.',
  s:['المداخيل تتسجّل وحدها من الفواتير المدفوعة والفارسمو.','«مصروف»: اكتب المبلغ بالدينار (ماشي بالسنتيم) والسبب: نقل، غداء، كراء…','«إغلاق الصندوق»: عدّ الدراهم اللي في الصندوق وقارنها مع التطبيق.'],
  p:[]},
 fr:{t:'Caisse et dépenses',i:'Ce qui est entré et sorti chaque jour.',
  s:['Les entrées viennent seules des factures payées et des versements.','« Dépense » : montant en dinars (pas en centimes) et motif : transport, repas, loyer…','« Clôture de caisse » : comptez la caisse et comparez avec l’application.'],
  p:[]}},
{id:'reports',icon:'chart',views:['debts','stats','reports','export'],
 ar:{t:'الديون، الأرباح والتقارير',i:'باش تعرف وين راك: شكون عليه، شحال ربحت، وواش تبيع أكثر.',
  s:['«الديون والأرباح»: الديون حسب الحرفي، والربح بين تاريخين.','«الإحصائيات»: المبيعات، المشتريات، المرتجعات… بين تاريخين.','«التقارير الشهرية»: رقم الأعمال، الهامش، وأعمار الديون لكل شهر.','«تصدير Excel»: ملفات تفتح في Excel للمحاسب أو للأرشيف.'],
  p:['الربح = سعر البيع − آخر سعر شراء قبل تاريخ البيع، ناقص التخفيض. التشطيب يُحسب كله ربح.']},
 fr:{t:'Crédits, bénéfices et rapports',i:'Pour savoir où vous en êtes : qui doit, combien vous gagnez, ce qui se vend.',
  s:['« Crédits et bénéfices » : crédits par atelier, et marge entre deux dates.','« Statistiques » : ventes, achats, retours… entre deux dates.','« Rapports mensuels » : chiffre d’affaires, marge et ancienneté des crédits.','« Export Excel » : fichiers pour le comptable ou l’archive.'],
  p:['Marge = prix de vente − dernier prix d’achat avant la vente, moins la remise. Le façonnage compte entièrement en marge.']}},
{id:'cut',icon:'cut',views:['cut'],
 ar:{t:'مخطط القص',i:'يرتّبلك القطع في اللوح باش تقص بأقل خسارة.',
  s:['اكتب مقاس اللوح (321×225 مثلاً) ومقاسات القطع وعددها.','⇄ مفعّل = يمكن تدوير القطعة. أطفيه للزجاج المنقوش اللي عندو اتجاه.','الأسطر الخضراء بقايا من المخزون، تُستعمل أولاً.','من النتيجة تقدر تحفظ البقايا الجديدة في المخزون.'],
  p:['x = قصّة بالعرض، y = قصّة بالطول. القطعة الجاهزة بالخط العريض.']},
 fr:{t:'Plan de découpe',i:'Place les pièces dans la plaque pour couper avec le moins de pertes.',
  s:['Saisissez le format de la plaque (321×225 par ex.), puis les pièces et quantités.','⇄ activé = la pièce peut tourner. Désactivez pour le verre imprimé à sens.','Les lignes vertes sont des chutes du stock, utilisées en premier.','Depuis le résultat, enregistrez les nouvelles chutes en stock.'],
  p:['x = coupe en largeur, y = coupe en hauteur. La pièce finie est en gras.']}},
{id:'weight',icon:'weight',views:['weight'],
 ar:{t:'وزن الزجاج',i:'يحسبلك الوزن التقريبي قبل ما تحمّل.',
  s:['اكتب العرض والطول والعدد، واختر السمك أو نوع الزجاج.','الحساب: العرض × الطول (بالمتر) × السمك (ملم) × 2.5 كغ.'],
  p:[]},
 fr:{t:'Poids du verre',i:'Calcule le poids approximatif avant le chargement.',
  s:['Saisissez largeur, hauteur et quantité, puis l’épaisseur ou le type de verre.','Calcul : largeur × hauteur (m) × épaisseur (mm) × 2,5 kg.'],
  p:[]}},
{id:'notes',icon:'note',views:['notes','nform'],
 ar:{t:'دفتر الملاحظات',i:'للمبالغ الصغيرة والطلبات اللي ما تحبش تنساها: اسم الشخص والمبلغ التقريبي.',
  s:['«ملاحظة جديدة»: الاسم، الهاتف، المبلغ والتفاصيل.','كي تخلص، علّمها «تم».','إذا ولّى زبون دائم: «تحويلها إلى حرفي».'],
  p:['الملاحظات ما تدخلش في حسابات الحرفيين.']},
 fr:{t:'Carnet de notes',i:'Pour les petites sommes et demandes à ne pas oublier : nom et montant approximatif.',
  s:['« Nouvelle note » : nom, téléphone, montant et détails.','Une fois réglée, marquez-la « fait ».','Si c’est un client régulier, transformez-la en atelier.'],
  p:['Les notes n’entrent pas dans les comptes des ateliers.']}},
{id:'settings',icon:'sliders',views:['set','acct','shop','prices','tedit','svcs','staff','me','setsec','setlook','setfeat'],
 ar:{t:'الإعدادات',i:'معلومات المحل، الأسعار، الحساب والعمّال.',
  s:['«أنواع الزجاج والأسعار»: سعر المتر لكل نوع. السعر الجديد يطبَّق على الفواتير الجديدة فقط.','«التشطيب والحد الأدنى»: جوان بلا، بيزو، ثقوب… وأصغر مساحة تُحسب.','«معلومات المحل»: الهاتف، العنوان، السجل التجاري، والشعار اللي يبان في الفاتورة.','«حسابات العمّال»: عامل يبيع بلا ما يشوف الأرباح ولا يحذف.','«الدخول السريع في هذا الهاتف»: رمز من 4 إلى 8 أرقام ولا البصمة بدل كلمة السر.','اللغة (العربية / Français) والوضع الليلي من «المظهر واللغة».'],
  p:[]},
 fr:{t:'Réglages',i:'Infos du magasin, prix, compte et employés.',
  s:['« Types de verre et prix » : prix au m² par type. Le nouveau prix s’applique aux nouvelles factures.','« Façonnage et minimum » : joint plat, biseau, perçage… et surface minimale facturée.','« Infos du magasin » : téléphone, adresse, RC/NIF et logo sur la facture.','« Comptes employés » : un vendeur qui ne voit pas les bénéfices et ne supprime rien.','« Accès rapide » : code de 4 à 8 chiffres ou empreinte au lieu du mot de passe.','Langue et mode sombre dans « Affichage et langue ».'],
  p:[]}},
{id:'backup',icon:'upload',views:['cloud','setbk'],adm:true,
 ar:{t:'النسخة الاحتياطية والسحاب',i:'إذا ضاع الهاتف ولا تكسّر، النسخة هي اللي تحفظ الحسابات. هذي أهم حاجة في الدليل.',
  s:['الإعدادات ← «النسخة الاحتياطية» ← «إرسال النسخة»: أرسلها لروحك بالواتساب ولا الإيميل كل أسبوع.','النسخة الأوتوماتيكية: كل أسبوع يتنزّل ملف وحده في «التنزيلات».','الاسترجاع: «استعادة البيانات من نسخة» واختار الملف. البيانات الحالية تتبدل بالنسخة.','«المزامنة السحابية»: نسخة دائمة في السحاب ونفس الدفتر في أكثر من هاتف. التطبيق يبقى يخدم بلا إنترنت.'],
  p:['الرئيسية تنبّهك إذا فات وقت بلا نسخة.']},
 fr:{t:'Sauvegarde et cloud',i:'Si le téléphone est perdu ou cassé, la sauvegarde protège les comptes. C’est le plus important du guide.',
  s:['Réglages ← « Sauvegarde » ← « Envoyer » : envoyez-la-vous par WhatsApp ou e-mail chaque semaine.','Sauvegarde automatique : chaque semaine, un fichier arrive dans « Téléchargements ».','Restaurer : « Restaurer une sauvegarde » et choisissez le fichier. Les données actuelles sont remplacées.','« Synchronisation cloud » : copie permanente et même registre sur plusieurs téléphones. Marche aussi sans internet.'],
  p:['L’accueil vous prévient si la dernière sauvegarde est trop ancienne.']}},
{id:'import',icon:'scan',views:['import'],adm:true,
 ar:{t:'استيراد الديون من الكراس',i:'بدل ما تدخل الحرفيين واحد بواحد.',
  s:['صوّر الكراس صفحة بصفحة، في ضوء مليح.','أرسل الصور لـ Claude مع الطلب المكتوب في الصفحة، يعطيك جدول.','الصق الجدول في الخانة (ولا اختار ملف Excel / CSV: الحرفي، الهاتف، الدين، ملاحظة).','صحّح أي اسم ولا مبلغ قبل الحفظ.'],
  p:[]},
 fr:{t:'Importer le cahier',i:'Au lieu de saisir les ateliers un par un.',
  s:['Photographiez le cahier page par page, avec une bonne lumière.','Envoyez les photos à Claude avec la demande affichée : il vous donne un tableau.','Collez le tableau (ou choisissez un fichier Excel / CSV : atelier, téléphone, crédit, note).','Corrigez noms et montants avant d’enregistrer.'],
  p:[]}},
{id:'security',icon:'lock',views:['events','wipe'],adm:true,
 ar:{t:'الأمان وكلمة السر',i:'الدفتر محمي بكلمة سر، ويتقفل وحده بعد مدة.',
  s:['نسيت كلمة السر؟ في شاشة الدخول ← «نسيت كلمة السر؟» واكتب رمز الاسترجاع اللي سجّلته في الكراس.','ضاع رمز الاسترجاع؟ الإعدادات ← «اسم المستخدم وكلمة السر» ← رمز جديد.','«Events»: سجل كل تبديل باليوم والساعة، شكون داره.','«القفل التلقائي»: بعد كم دقيقة يتقفل التطبيق.'],
  p:['التصفير، حذف نوع زجاج، حذف حساب عامل وحذف كل الحرفيين يطلبوا كلمة سر المسؤول.']},
 fr:{t:'Sécurité et mot de passe',i:'Le registre est protégé par mot de passe et se verrouille seul.',
  s:['Mot de passe oublié ? À la connexion ← « Mot de passe oublié ? » et saisissez le code de secours noté dans le cahier.','Code perdu ? Réglages ← « Identifiant et mot de passe » ← nouveau code.','« Events » : historique de chaque modification, avec jour, heure et auteur.','« Verrouillage automatique » : délai avant verrouillage.'],
  p:['Remise à zéro, suppression d’un type de verre, d’un employé ou de tous les ateliers : mot de passe du responsable.']}}
];

function guideSec(v){const g=GUIDE.find(x=>x.views.includes(v));return g?g.id:'start'}
const GUIDE_FEAT={quote:'quotes',sups:'sups',cut:'tools',weight:'tools'};

function guideBody(g){const L=isFr()?g.fr:g.ar;

function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());return dstr(d)}
function dbRange(){const td=today();if(dbv.p==='today')return[td,td];if(dbv.p==='week')return[weekStart(),td];if(dbv.p==='month')return[td.slice(0,7)+'-01',td];if(dbv.p==='custom')return[dbv.from||td.slice(0,7)+'-01',dbv.to||td];return['0000-01-01','9999-12-31']}
function bonMargin(b){let m=0,u=0;if(!b||b.kind==='opening')return{m,u};
  if(b.kind==='return'){for(const l of b.lines||[]){if(l.lk==='art'){const c=artCostAt(l.articleId,b.date);m+=num(l.amount)+(b.restock&&c!==null?num(l.baseQty||l.qty)*c:0);continue}const c=costAt(l.typeId,b.date);m+=num(l.amount)+(b.restock&&c!==null?num(l.area)*c:0)}return{m,u}}
  for(const l of b.lines||[]){if(l.lk==='art'){if(l.cat==='svc'){m+=num(l.amount);continue}const c=artCostAt(l.articleId,b.date);if(c===null)u+=num(l.amount);else m+=num(l.amount)-num(l.baseQty||l.qty)*c;continue}
    const c=costAt(l.typeId,b.date);if(c===null)u+=num(l.amount);else m+=num(l.amount)-num(l.area)*c}
  m-=num(b.disc);return{m,u}}
function dbData(f,t){const rows={};const R=k=>rows[k]||(rows[k]={id:k,buy:0,paid:0,sales:0,m:0,u:0});
  for(const b of Object.values(S.bons)){if(!b.date||b.date<f||b.date>t)continue;const k=b.walkin?'__walk':b.clientId;if(!k||(k!=='__walk'&&!S.clients[k]))continue;const r=R(k),amt=num(b.total);
    r.buy+=amt;if(b.walkin)r.paid+=walkPaid0(b)+(b.wpays||[]).filter(w=>w.date>=f&&w.date<=t).reduce((a,w)=>a+num(w.amount),0);if(b.kind!=='opening'){r.sales+=amt;const x=bonMargin(b);r.m+=x.m;r.u+=x.u}}
  for(const p of Object.values(S.pays)){if(!p.date||p.date<f||p.date>t||!S.clients[p.clientId])continue;R(p.clientId).paid+=num(p.amount)}
  if(f==='0000-01-01')for(const id in S.stats)if(S.clients[id]&&num(S.stats[id].bal)>0.5)R(id);
  for(const r of Object.values(rows)){r.debt=r.buy-r.paid;r.bal=r.id==='__walk'?0:num((S.stats[r.id]||{}).bal);r.name=r.id==='__walk'?tr('زبائن عاديون','Clients comptoir'):S.clients[r.id].name}
  return Object.values(rows)}

function chart7(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const s=days.map(d=>0),p=days.map(d=>0);
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;const i=days.indexOf(b.date);if(i>=0)s[i]+=num(b.total)}
  for(const id in S.pays){const x=S.pays[id];const i=days.indexOf(x.date);if(i>=0)p[i]+=num(x.amount)}
  for(const id in S.bons){const b=S.bons[id];if(!b.walkin)continue;const i=days.indexOf(b.date);if(i>=0)p[i]+=walkPaid0(b);for(const w of b.wpays||[]){const j=days.indexOf(w.date);if(j>=0)p[j]+=num(w.amount)}}
  const max=Math.max(...s,...p);if(!max)return'';
  const W=320,H=130,top=10,bot=22,ch=H-top-bot,gw=W/7,bw=Math.min(14,gw/3);
  const y=v=>top+ch-(v/max)*ch;
  const lab=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(isFr()?'fr-FR':'ar-DZ-u-nu-latn',{weekday:'short'})}catch(_){return d.slice(8)}};
  let g='';
  for(let i=0;i<7;i++){const ii=isFr()?i:6-i,cx=gw*ii+gw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(s[i])}" width="${bw}" height="${Math.max(0,top+ch-y(s[i]))}" rx="3" fill="var(--accent)"/>`;
    g+=`<rect x="${cx+1}" y="${y(p[i])}" width="${bw}" height="${Math.max(0,top+ch-y(p[i]))}" rx="3" fill="var(--edge)"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lab(days[i]))}</text>`}
  return `<div class="sec"><h3>${tr('آخر 7 أيام','7 derniers jours')}</h3><span class="note">${tr('أعلى يوم','Max')} ${DA(max)}</span></div>
  <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('المبيعات والمداخيل','Ventes et encaissements')}"><line x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)"/><line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 4"/>${g}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>${tr('مبيعات','Ventes')}</span><span><i style="background:var(--edge)"></i>${tr('مداخيل','Encaissements')}</span></div></div>`;
}

function releveText(id,f='0000-01-01',t='9999-12-31'){

function frWords(n){
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const t=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const u99=n=>{if(n<20)return u[n];const d=Math.floor(n/10),r=n%10;if(d===7||d===9)return t[d]+(d===7&&r===1?' et ':'-')+u[10+r];if(r===0)return d===8?t[d]+'s':t[d];if(r===1&&d!==8)return t[d]+' et un';return t[d]+'-'+u[r]};
  const u999=n=>{const c=Math.floor(n/100),r=n%100;let x='';if(c)x=(c>1?u[c]+' ':'')+'cent'+(c>1&&r===0?'s':'');if(r)x+=(x?' ':'')+u99(r);return x};
  if(n===0)return 'zéro';const parts=[];const g=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(g)parts.push(u999(g)+' milliard'+(g>1?'s':''));if(m)parts.push(u999(m)+' million'+(m>1?'s':''));
  if(k)parts.push(k===1?'mille':u999(k).replace(/cents$/,'cent').replace(/vingts$/,'vingt')+' mille');if(r)parts.push(u999(r));return parts.join(' ');
}
function arWords(n){
  if(n===0)return 'صفر';
  const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const H=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const a99=n=>n<20?U[n]:(n%10?U[n%10]+' و'+T[Math.floor(n/10)]:T[Math.floor(n/10)]);
  const a999=n=>[H[Math.floor(n/100)],n%100?a99(n%100):''].filter(Boolean).join(' و');
  const sc=(k,one,two,pl,acc)=>{const r=k%100;return k===1?one:k===2?two:r>=3&&r<=10?a999(k)+' '+pl:r>=11?a999(k)+' '+acc:a999(k)+' '+one};
  const parts=[[Math.floor(n/1e9),'مليار','ملياران','مليارات','ملياراً'],[Math.floor(n%1e9/1e6),'مليون','مليونان','ملايين','مليوناً'],[Math.floor(n%1e6/1e3),'ألف','ألفان','آلاف','ألفاً']].filter(x=>x[0]).map(x=>sc(...x));
  if(n%1000)parts.push(a999(n%1000));return parts.join(' و');

  let u=c.toDataURL('image/png');if(u.length>160000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}URL.revokeObjectURL(url);res(u)}catch(_){res(null)}};img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url})}

    if(v&&l.lk==='art'){const a=S.arts[l.articleId],e=S.ak[l.articleId];if(!artTracked(a)||!e||(!e.inQ&&!e.adjQ)){v.innerHTML='';v.className='avail'}else{const short=needA[l.articleId]>e.bal+0.0001;v.className='avail'+(short?' short':'');v.innerHTML=(short?tr('غير كافٍ! ','Insuffisant ! '):'')+tr('في المخزون ','En stock ')+artQtyTxt(a,e.bal)}}

  const t=bonTotal();{const e_=$('#ta');if(e_)e_.innerHTML=M2(ta)}{const sb=$('#sbt');if(sb)sb.innerHTML=t>0?' · '+DA(t):''}$('#tt').innerHTML=DA(t)+(num(draft.disc)>0?` <small class="note">(${DA(bonSub())} − ${DA(num(draft.disc))})</small>`:'');

function evHook(p,old,nw){

    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${o} 0 R >> >> /Contents ${c} 0 R >>`);
    obj(c,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(o,[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream'])});

/* ---- cutting plan (guillotine) — like CutList Optimizer ---- */
let cutSrc=null;
const CUT_KEY='gg-cut';
const cf1=v=>{const r=Math.round(num(v)*10)/10;return String(r)};
const ccm=v=>`<bdi dir="ltr">${cf1(v)}</bdi>`;
/* one packing pass. pieces: [{w,h,rot,lab,k}] (one per piece), stocks: [{w,h,qty}] (qty 0 = no limit) */
function gPackOnce(pieces,stocks,kerf,fit,split){
  const E=1e-6,sheets=[],over=[],left=stocks.map(s=>num(s.qty)>0?num(s.qty):Infinity);
  const orients=p=>p.rot&&Math.abs(p.w-p.h)>E?[[p.w,p.h],[p.h,p.w]]:[[p.w,p.h]];
  const fits=(w,h,f)=>w<=f.w+E&&h<=f.h+E;
  const score=(w,h,f)=>fit==='bssf'?Math.min(f.w-w,f.h-h):fit==='blsf'?Math.max(f.w-w,f.h-h):f.w*f.h-w*h;
  const best=(s,p)=>{let b=null;s.free.forEach((f,i)=>{for(const [w,h] of orients(p)){if(!fits(w,h,f))continue;const sc=score(w,h,f);if(!b||sc<b.sc-E)b={i,w,h,sc}}});return b};
  const place=(s,p,b)=>{const f=s.free.splice(b.i,1)[0],w=b.w,h=b.h,rw=f.w-w,bh=f.h-h,k=kerf,n0=s.cuts.length;
    s.used.push({x:f.x,y:f.y,w,h,lab:p.lab,turned:w!==p.w||h!==p.h});
    const add=r=>{if(r.w>E&&r.h>E)s.free.push(r)};
    /* A: cut along the width first (x = w), then the strip (y = h). B: the opposite. */
    let useA;
    if(split==='A')useA=true;else if(split==='B')useA=false;
    else{const aMax=Math.max((rw-k)*f.h,w*(bh-k)),bMax=Math.max(f.w*(bh-k),(rw-k)*h);useA=split==='max'?aMax>=bMax:aMax<bMax}

async function readImportFile(f){
  const name=(f.name||'').toLowerCase(),buf=new Uint8Array(await f.arrayBuffer());
  const info=(t,b)=>ask({title:t,body:b,ok:tr('فهمت','Compris'),cancel:false,danger:false,icon:'doc'});

  const zip=buf[0]===0x50&&buf[1]===0x4B,ole=buf[0]===0xD0&&buf[1]===0xCF;

  let txt=new TextDecoder('utf-8').decode(buf);
  const bad=(txt.match(/[\uFFFD\u0000-\u0008\u000E-\u001F]/g)||[]).length;

  return txt;
}
const normName=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'').replace(/```[a-z]*\n?/gi,'').trim();if(!text)return[];
  const first=text.split(/\r?\n/)[0];const sep=[',',';','\t','،'].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch;continue}
    if(ch==='"'){q=true;continue}
    if(ch===sep){cur.push('');continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;rows.push(cur);cur=[''];continue}
    cur[cur.length-1]+=ch}
  rows.push(cur);
  const money=v=>{let s=String(v||'').replace(/[^\d.,-]/g,'');if(/[.,]\d{1,2}$/.test(s))s=s.replace(/[.,]\d{1,2}$/,'');return s.replace(/[.,]/g,'')};
  const out=[];
  for(const r of rows){const c=r.map(x=>String(x).trim());if(!c.some(Boolean))continue;
    if(BAD_RE.test(c.join('')))continue; /* binary garbage */
    let [name,phone,debt,...rest]=c;
    if(c.length===2){debt=c[1];phone=''}
    const d=money(debt);
    if(!name||name.length>60||!/\d/.test(d||''))continue; /* header or junk */
    phone=String(phone||'').replace(/[^\d+ ]/g,'').trim();if(phone.replace(/\D/g,'').length>15)phone='';
    const big=num(d)>=1e8;
    out.push({name,phone,debt:d,note:(rest.join(' ').trim()+(big?' '+tr('(تحقق: المبلغ كبير جداً)','(à vérifier : montant très élevé)'):'')).trim(),on:!big});
  }
  return out;
}

function refresh(){
  compute();

  if(g!==null||!$('#gate').hidden||$('#shell').hidden){render();return}
  const v=view.name;
  if(['collect','pos','poview','home','client','bonview','stock','set','quotes','quoteview','cash','reports','cut','journal','sups','sup','export'].includes(v))render();
  else if(v==='stats'||v==='art')render();
  else if(v==='stock'&&stkTab==='art'){if(!(document.activeElement&&document.activeElement.id==='artq'))render()}
  else if(v==='search'){const r=$('#gsr');if(r)r.innerHTML=searchResults()}

}

      await db.collection('stock').doc().set({kind:'in',typeId:ty.id,type:ty.name,date:kdraft.date||today(),sheets:num(kdraft.sheets),sw:num(kdraft.sw),sh:num(kdraft.sh),area:Math.round(c.area*10000)/10000,costM2:num(kdraft.costM2),mm:mmN,cost:c.cost,supplierId:sid,supplier:sname,paid:sid?Math.min(c.cost,Math.round(num(kdraft.paid))):0,createdAt:Date.now()});
      if(newTypes)await saveSettings({types:newTypes})},newTypes?tr('تم تسجيل السلعة وتحديث سعر البيع.','Entrée enregistrée, prix de vente mis à jour.'):tr('تم تسجيل السلعة.','Entrée enregistrée.'));
    if(ok){kdraft=null;if(!poNext())go('stock')}return}
  if(a==='save-adj'){
    if(adraft.real==='')return toast(tr('اكتب الكمية الموجودة.','Saisissez le stock réel.'));const e2=S.sk[adraft.typeId]||{bal:0};const d=Math.round((num(adraft.real)-e2.bal)*10000)/10000;
    if(Math.abs(d)<0.0001)return toast(tr('لا يوجد فرق.','Aucun écart.'));const ty=types().find(x=>x.id===adraft.typeId)||{name:e2.name};
    if(await write(()=>db.collection('stock').doc().set({kind:'adj',typeId:adraft.typeId,type:ty.name,date:adraft.date||today(),area:d,note:adraft.note.trim(),createdAt:Date.now()}),tr('تم حفظ التعديل.','Ajustement enregistré.'))){adraft=null;go('stock')}return}
  if(a==='del-mv'){const m=S.stock[id];if(!m)return;
    if(!await ask({title:m.kind==='in'?tr('حذف دخول السلعة؟','Supprimer cette entrée ?'):tr('حذف تعديل الجرد؟','Supprimer cet ajustement ?'),ok:tr('حذف','Supprimer'),
      body:`${esc(m.type)} · ${M2(Math.abs(num(m.area)))} · ${fdate(m.date)}<br>${tr('سيتغير رصيد المخزون لهذا النوع.','Le stock de ce type sera recalculé.')}`}))return;
    await removeDocs(['stock/'+id],tr('تم حذف الحركة','Mouvement supprimé'));return}
  if(a==='del-pay'){const p=S.pays[id];if(!p)return;
    if(!await ask({title:tr('حذف هذا الفارسمو؟','Supprimer ce versement ?'),ok:tr('حذف','Supprimer'),body:`${DA(p.amount)} · ${fdate(p.date)}<br>${tr('سيرتفع دين الحرفي بنفس المبلغ.','Le crédit du client augmentera du même montant.')}`}))return;
    const wasEdit=view.name==='pay';await removeDocs(['payments/'+id],tr('تم حذف الفارسمو','Versement supprimé'));if(wasEdit){pdraft=null;go('client',{id:p.clientId})}return}
  if(a==='del-bon'){const bon=S.bons[id];if(!bon)return;const cid=bon.clientId;const linked=Object.keys(S.pays).filter(p=>S.pays[p].bonId===id);const rets=Object.keys(S.bons).filter(k=>S.bons[k].refOf===id);const lp=linked.reduce((s,p)=>s+num(S.pays[p].amount),0);
    const area=(bon.lines||[]).reduce((s,l)=>s+num(l.area),0);
    if(!await ask({title:bon.kind==='opening'?tr('حذف الدين القديم؟','Supprimer l’ancien crédit ?'):tr(`حذف الفاتورة رقم ${bon.num}؟`,`Supprimer la facture n° ${bon.num} ?`),ok:tr('حذف','Supprimer'),
      body:`<ul><li>${tr('المبلغ','Montant')}: ${DA(bon.total)}</li>${area&&bon.kind!=='return'?`<li>${tr('يرجع إلى المخزون','Retour en stock')}: ${M2(area)}</li>`:''}${rets.length?`<li>${tr('تُحذف معها المرتجعات المرتبطة بها','Retours liés supprimés')}: ${rets.length}</li>`:''}${lp?`<li>${tr('يُحذف معها الدفع المرتبط بها','Paiement lié supprimé aussi')}: ${DA(lp)}</li>`:''}</ul><p style="margin:8px 0 0">${tr('يمكنك التراجع بعد الحذف مباشرة.','Vous pourrez annuler juste après.')}</p>`}))return;
    if(await removeDocs([...linked.map(p=>'payments/'+p),...rets.map(k=>'bons/'+k),'bons/'+id],tr('تم حذف الفاتورة','Facture supprimée'))){if(cid)go('client',{id:cid});else{ctab='walk';go('clients')}}return}
  if(a==='del-client'){const c=S.clients[id];if(!c)return;
    const bs=Object.keys(S.bons).filter(x=>S.bons[x].clientId===id),ps=Object.keys(S.pays).filter(x=>S.pays[x].clientId===id);const st=S.stats[id]||{bal:0};
    if(!await ask({title:tr(`حذف «${esc(c.name)}» نهائياً؟`,`Supprimer « ${esc(c.name)} » ?`),ok:tr('حذف الحرفي','Supprimer le client'),
      body:`<ul><li>${bs.length} ${tr('فاتورة','factures')}، ${ps.length} ${tr('دفعة','paiements')}</li><li>${tr('الدين الحالي','Crédit actuel')}: ${DA(st.bal)}</li><li>${tr('الزجاج المباع لها يرجع إلى المخزون.','Le verre vendu revient en stock.')}</li></ul>
      ${st.bal>0?`<p style="margin:8px 0 0;color:var(--debt);font-weight:600">${tr('تنبيه: على هذا الحرفي دين لم يُسدَّد.','Attention : ce client a un crédit non soldé.')}</p>`:''}`}))return;
    if(await removeDocs([...ps.map(p=>'payments/'+p),...bs.map(x=>'bons/'+x),'clients/'+id],tr(`تم حذف «${c.name}»`,`« ${c.name} » supprimé`)))go('clients');return}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(prefs.lock===0&&unlocked&&S.auth){/* lock on next open */endSession();}else touch(true)}
  else if(S.auth&&$('#gate').hidden&&!sessionValid()){lockNow()}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view.name==='set'&&$('#gate').hidden)render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast(tr('تم تثبيت التطبيق.','Application installée.'))});

/* ====================== boot ====================== */
applyPrefs();
(async()=>{
  try{if(!window.indexedDB||!window.crypto||!crypto.subtle)throw 0;await LocalDB.load()}
  catch(e){$('#boot').innerHTML=`<div class="gate-card"><div class="gate-head">${MARK}<b dir="ltr">Gessoum Glass</b></div><p class="note">${tr('هذا المتصفح لا يسمح بحفظ البيانات. افتح التطبيق في Chrome أو Safari، دون الوضع الخفي.','Ce navigateur ne permet pas d’enregistrer les données. Ouvrez l’application dans Chrome ou Safari, hors navigation privée.')}</p></div>`;return}
  db=LocalDB;dbState='ok';LocalDB.setHook(markOut);LocalDB.setEvtHook(evHook);cloudBoot();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const asMap=q=>Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));
  db.doc('auth/main').onSnapshot(s=>{S.auth=s.exists?s.data():null;S.ok.a=true;refresh()});
  db.doc('settings/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.types=Array.isArray(d.types)&&d.types.length?d.types:null;S.shop=d.shop||{};S.svcs=Array.isArray(d.svcs)?d.svcs:null;S.minArea=d.minArea||0;S.feat=d.feat||{};refresh()});
  db.collection('quotes').onSnapshot(q=>{S.quotes=asMap(q);refresh()});
  db.collection('offcuts').onSnapshot(q=>{S.offc=asMap(q);refresh()});
  db.collection('closings').onSnapshot(q=>{S.closings=asMap(q);refresh()});
  db.collection('porders').onSnapshot(q=>{S.porders=asMap(q);refresh()});
  db.collection('expenses').onSnapshot(q=>{S.exps=asMap(q);refresh()});
  db.collection('notes').onSnapshot(q=>{S.notes=asMap(q);if(['notes','nform','home'].includes(view.name))refresh()});
  db.collection('suppliers').onSnapshot(q=>{S.sups=asMap(q);refresh()});
  db.collection('spays').onSnapshot(q=>{S.spays=asMap(q);refresh()});
  db.collection('articles').onSnapshot(q=>{S.arts=asMap(q);refresh()});
  db.collection('amoves').onSnapshot(q=>{S.amv=asMap(q);refresh()});
  db.collection('events').onSnapshot(q=>{S.evs=asMap(q);if(view.name==='events')refresh()});
  db.collection('clients').onSnapshot(q=>{S.clients=asMap(q);S.ok.c=true;refresh()});
  db.collection('bons').onSnapshot(q=>{S.bons=asMap(q);S.ok.b=true;refresh()});
  db.collection('payments').onSnapshot(q=>{S.pays=asMap(q);S.ok.p=true;refresh()});
  db.collection('stock').onSnapshot(q=>{S.stock=asMap(q);S.ok.k=true;refresh()});
})();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadCtl=!!navigator.serviceWorker.controller;let reloading=false;
  const busy=()=>['close','poform','staff','bon','pay','cform','kin','kadj','exp','ret','sform','spay','prices','shop','acct','import','svcs','odebt','climit','cprice','nform','tedit','me','dnote'].includes(view&&view.name);
  const doReload=()=>{if(reloading)return;reloading=true;location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl)return;
    if(!busy())return doReload();
    toast(tr('تحديث جديد جاهز، يُطبَّق عند إنهاء هذه الصفحة.','Mise à jour prête, appliquée après ce formulaire.'));
    const t=setInterval(()=>{if(!busy()){clearInterval(t);doReload()}},1500)});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const chk=()=>{if(navigator.onLine)reg.update().catch(()=>{})};
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
    setInterval(chk,30*60*1000)}).catch(()=>{})})}
</script>
