<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الزجاج</title>
<meta name="theme-color" content="#17635e">
<meta name="description" content="دفتر محل الزجاج: البيع بالكريدي، ديون ورشات الألمنيوم، والسطوك">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الزجاج">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one-column ledger — debt summary on top, workshops list sorted by debt, fixed bottom bar for the three daily actions */
:root{
  --bg:#edf2f1; --surface:#fbfdfc; --sunk:#e3ebe9; --ink:#13201e; --muted:#566664; --line:#cfdbd8;
  --accent:#17635e; --accent-ink:#f4fbfa; --accent-soft:#d6e9e6; --edge:#9fd3c7;
  --debt:#ad3a2e; --debt-soft:#f7e2de; --warn:#8c5b0a; --warn-soft:#f5ead2; --ok:#2a7042; --ok-soft:#dcefe2;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --f-disp:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1615; --surface:#162120; --sunk:#1d2a29; --ink:#e3eeec; --muted:#93a7a4; --line:#2a3f3c;
  --accent:#55b6ac; --accent-ink:#05201d; --accent-soft:#1d3a37; --edge:#2f6a61;
  --debt:#f08374; --debt-soft:#3a1f1b; --warn:#e3ab52; --warn-soft:#3a2c14; --ok:#72c890; --ok-soft:#183324;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1615; --surface:#162120; --sunk:#1d2a29; --ink:#e3eeec; --muted:#93a7a4; --line:#2a3f3c;
  --accent:#55b6ac; --accent-ink:#05201d; --accent-soft:#1d3a37; --edge:#2f6a61;
  --debt:#f08374; --debt-soft:#3a1f1b; --warn:#e3ab52; --warn-soft:#3a2c14; --ok:#72c890; --ok-soft:#183324;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:1.45rem;color:var(--accent);margin:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-size:.8rem;font-weight:600;color:var(--muted);margin:0;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{background:transparent;color:var(--debt);border:1px solid var(--debt-soft)}
.btn.danger[data-armed]{background:var(--debt);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.stack{display:flex;flex-direction:column;gap:14px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.big .lbl{font-size:.82rem;color:var(--muted);font-weight:500}
.big .val{font-size:2rem;font-weight:700;color:var(--debt);line-height:1.2}
.big .val .cur{font-size:1rem;font-weight:500;margin-inline-start:4px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.mini div{min-width:0}
.mini .lbl{font-size:.74rem;color:var(--muted)}
.mini .v{font-weight:600;font-size:.98rem}

.bar{display:flex;gap:8px;margin-block:16px 10px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.rmain{display:flex;flex-direction:column;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:.8rem;color:var(--muted)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.amt{font-weight:700}
.amt.neg{color:var(--debt)}
.amt.pos{color:var(--ok)}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--debt-soft);color:var(--debt)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.note{font-size:.84rem;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}

/* client */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.chead{display:flex;flex-direction:column;gap:4px}
.balbox{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{width:100%}
.led{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.le{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.le:last-child{border-bottom:0}
button.le:hover{background:var(--sunk)}
.le .what{font-weight:600}
.le .d{font-size:.78rem;color:var(--muted)}
.le .run{font-size:.78rem;color:var(--muted);text-align:end}
.le .a{text-align:end;font-weight:700}
.le.pay .a{color:var(--ok)}
.copyfall{width:100%;min-height:140px;font-size:.85rem;direction:rtl}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.line .lt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.line .ld{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.line .lr{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:7px 10px;gap:8px;flex-wrap:wrap}
.line .lr b{color:var(--ink)}
.x{background:transparent;border:1px solid var(--line);border-radius:9px;width:42px;height:42px;color:var(--muted);font-size:1.1rem}
.totals{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.trow.big{font-size:1.2rem;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--sunk);border:0;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-weight:600;color:var(--muted);font-size:.76rem;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.typerow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center}

nav.bottom{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.bottom .in{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:6px;max-width:608px;width:100%}
/* stock */
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sk .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sk .q{font-size:1.45rem;font-weight:700;line-height:1.2}
.sk .q.low{color:var(--warn)}
.sk .q.out{color:var(--debt)}
.sk .meta{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column}
.avail{font-size:.8rem}
.avail.short{color:var(--debt);font-weight:600}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.mv:last-child{border-bottom:0}
.mv .what{font-weight:600}
.mv .d{font-size:.78rem;color:var(--muted);grid-column:1}
.mv .a{text-align:end;font-weight:700}
.mv .a.in{color:var(--ok)}
.mv .a.adj{color:var(--warn)}
.mv .del{grid-column:2;grid-row:2;justify-self:end;padding:3px 10px;font-size:.76rem}
@media (max-width:360px){.skgrid{grid-template-columns:minmax(0,1fr)}}
nav.bottom button{background:transparent;border:0;border-radius:10px;padding:9px 6px;font-weight:600;color:var(--muted)}
nav.bottom button.on{color:var(--accent);background:var(--accent-soft)}
nav.bottom button.main{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <h1 class="brand">دفتر الزجاج<small>البيع بالكريدي وديون ورشات الألمنيوم</small></h1>
  </header>
  <main id="main"><div class="empty"><p>جاري تحميل الدفتر…</p></div></main>
</div>
<nav class="bottom" dir="rtl"><div class="in">
  <button id="nb-home" data-act="nav-home">الزبائن</button>
  <button id="nb-bon" class="main" data-act="nav-bon">+ بون</button>
  <button id="nb-stk" data-act="nav-stk">السطوك</button>
  <button id="nb-set" data-act="nav-set">الإعدادات</button>
</div></nav>
<div id="toast" class="toast" hidden></div>

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');
const TYPES0=[{id:'stp4',name:'STP 4',price:2000},{id:'sabli',name:'صابلي',price:2900},{id:'miroir',name:'مرآة',price:2300},{id:'warda',name:'وردة',price:2800}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const grp=n=>Math.round(n).toLocaleString('en-US');
const DA=n=>`<bdi dir="ltr">${grp(n)}</bdi> دج`;
const M2=a=>`<bdi dir="ltr">${(Math.round(a*100)/100).toFixed(2)}</bdi> م²`;
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fdate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `<bdi dir="ltr">${d}/${m}/${y}</bdi>`};
const fdateTxt=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const daysSince=s=>Math.max(0,Math.floor((Date.now()-new Date(s+'T12:00:00').getTime())/864e5));
const lineCalc=l=>{const area=num(l.w)*num(l.h)/10000*num(l.qty);return{area,amount:Math.round(area*num(l.price))}};

let db=null, dbState='loading', canWrite=true, busy=false, query='';
const S={types:null,clients:{},bons:{},pays:{},stock:{},ok:{c:false,b:false,p:false,k:false},stats:{},sk:{}};
let view={name:'home'}, draft=null, cdraft=null, pdraft=null, tdraft=null, kdraft=null, adraft=null;
const SHEET0={w:321,h:225};

function types(){return S.types||TYPES0}
function loaded(){return S.ok.c&&S.ok.b&&S.ok.p}
function compute(){
  const st={};
  for(const id in S.clients)st[id]={sales:0,paid:0,bal:0,lastPay:null,oldestBon:null,nb:0};
  for(const id in S.bons){const b=S.bons[id],s=st[b.clientId];if(!s)continue;s.sales+=num(b.total);s.nb++;if(!s.oldestBon||b.date<s.oldestBon)s.oldestBon=b.date}
  for(const id in S.pays){const p=S.pays[id],s=st[p.clientId];if(!s)continue;s.paid+=num(p.amount);if(!s.lastPay||p.date>s.lastPay)s.lastPay=p.date}
  for(const id in st)st[id].bal=st[id].sales-st[id].paid;
  S.stats=st;
  /* stock per glass type, in m² */
  const k={},mo=today().slice(0,7);
  const ent=(tid,name)=>k[tid]||(k[tid]={name,inA:0,outA:0,adjA:0,monthOut:0,last:null,bal:0});
  for(const t of types())ent(t.id,t.name);
  const mv=Object.values(S.stock).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const m of mv){const e=ent(m.typeId,m.type);if(m.kind==='in'){e.inA+=num(m.area);e.last=m}else e.adjA+=num(m.area)}
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;for(const l of b.lines||[]){const e=ent(l.typeId,l.type);e.outA+=num(l.area);if(b.date&&b.date.slice(0,7)===mo)e.monthOut+=num(l.area)}}
  for(const id in k){const e=k[id];e.bal=e.inA+e.adjA-e.outA;e.sheet=e.last?num(e.last.sw)*num(e.last.sh)/10000:null}
  S.sk=k;
}
function stockState(e){
  if(!e.inA&&!e.adjA)return{cls:'',chip:'<span class="chip">ما دخلتش سلعة</span>'};
  if(e.bal<=0.005)return{cls:'out',chip:'<span class="chip bad">خلاص</span>'};
  if(e.sheet&&e.bal<e.sheet)return{cls:'low',chip:'<span class="chip warn">أقل من بلاكة</span>'};
  return{cls:'',chip:'<span class="chip ok">متوفر</span>'};
}
function chip(s){
  if(!s)return'';
  if(s.bal<=0)return `<span class="chip ok">خالص</span>`;
  const ref=s.lastPay||s.oldestBon; if(!ref)return'';
  const d=daysSince(ref); const cls=d>60?'bad':d>30?'warn':'';
  return `<span class="chip ${cls}">${s.lastPay?'آخر دفع قبل':'ما دفع والو منذ'} <bdi dir="ltr">${d}</bdi> يوم</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return'ما تسجلش: ما عندكش صلاحية الكتابة في هذا الدفتر.';
  if(c==='quota_exceeded')return'الدفتر عمر. امسح بعض البيانات القديمة وعاود.';
  if(c==='resource_exhausted')return'بزاف عمليات في وقت قصير. استنى شوية وعاود.';
  return'ما تسجلش، تأكد من الأنترنت وعاود.';}
async function write(fn,okMsg){
  if(!db){toast('الدفتر مازال ما تحلّش، عاود بعد لحظة.');return false}
  if(busy)return false; busy=true;
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){try{if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));await fn();if(okMsg)toast(okMsg);return true}}catch(e2){e=e2}
    toast(errMsg(e));if(e&&e.code==='invalid_argument'){canWrite=false}return false}
  finally{busy=false}
}
function armed(btn){
  if(btn.dataset.armed)return true;
  btn.dataset.armed='1';const t=btn.textContent;btn.textContent='اضغط مرة أخرى للتأكيد';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},3500);return false;
}

/* ---------- views ---------- */
function sumHTML(){
  let debt=0,debtors=0,ms=0,mp=0;const m=today().slice(0,7);
  for(const id in S.stats){const s=S.stats[id];if(s.bal>0){debt+=s.bal;debtors++}}
  for(const id in S.bons){const b=S.bons[id];if(b.kind!=='opening'&&b.date&&b.date.slice(0,7)===m)ms+=num(b.total)}
  for(const id in S.pays){const p=S.pays[id];if(p.date&&p.date.slice(0,7)===m)mp+=num(p.amount)}
  return `<div class="big"><div class="lbl">مجموع الدين اللي برا</div><div class="val"><bdi dir="ltr">${grp(debt)}</bdi><span class="cur">دج</span></div></div>
  <div class="mini">
    <div><div class="lbl">ورشات عليها دين</div><div class="v"><bdi dir="ltr">${debtors}</bdi></div></div>
    <div><div class="lbl">مبيعات هذا الشهر</div><div class="v">${DA(ms)}</div></div>
    <div><div class="lbl">دراهم دخلت هذا الشهر</div><div class="v">${DA(mp)}</div></div>
  </div>`;
}
function hasExamples(){return Object.values(S.clients).some(c=>c.example)||Object.values(S.stock).some(c=>c.example)}
function exampleBanner(){return hasExamples()?`<div class="banner"><span>كاين ورشة <b>مثال</b> باش تشوف كيفاش يخدم الدفتر. امسحها قبل ما تبدا تسجل الحقيقي.</span>${canWrite?`<button class="btn danger" data-act="clear-ex">امسح المثال</button>`:''}</div>`:''}
function listHTML(){
  if(dbState==='none')return `<div class="empty"><p>هذا المتصفح ما يخليش التطبيق يسجل البيانات. حلّو في Chrome (ولا Safari في آيفون) وما تستعملش الوضع الخفي.</p></div>`;
  if(!loaded())return `<div class="empty"><p>جاري تحميل الورشات…</p></div>`;
  const ids=Object.keys(S.clients);
  if(!ids.length)return `<div class="empty"><p>ما زال ما سجلت حتى ورشة. ابدا بأول ورشة، وإذا عندها دين قديم في الكراس اكتبو وقت التسجيل باش يبدا الحساب صحيح.</p>${canWrite?`<button class="btn" data-act="add-client">+ زيد أول ورشة</button>`:''}</div>`;
  const q=query.trim().toLowerCase();

  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const colOf=p=>p.slice(0,p.lastIndexOf('/'));
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open('daftar-zujaj',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
  async function load(){
    idb=await open();
    await new Promise((res,rej)=>{const rq=idb.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)});
  }
  function tx(fn){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=()=>res();
    const bad=()=>rej({code:t.error&&t.error.name==='QuotaExceededError'?'quota_exceeded':'unavailable',message:String(t.error)});t.onerror=bad;t.onabort=bad})}
  const docSnap=p=>{const d=mem.get(p);return{id:p.slice(p.lastIndexOf('/')+1),exists:d!==undefined,data:()=>d}};
  const colSnap=c=>{const docs=[];for(const [k,v] of mem)if(colOf(k)===c)docs.push({id:k.slice(k.lastIndexOf('/')+1),exists:true,data:()=>v});return{docs,size:docs.length,empty:!docs.length}};
  function emit(paths){const cols=new Set(paths.map(colOf));for(const l of listeners){if(l.kind==='doc'&&paths.includes(l.path))l.fn(docSnap(l.path));if(l.kind==='col'&&cols.has(l.path))l.fn(colSnap(l.path))}}
  function doc(p){return{id:p.slice(p.lastIndexOf('/')+1),path:p,
    async set(d){const v=JSON.parse(JSON.stringify(d));await tx(s=>s.put(v,p));mem.set(p,v);emit([p])},
    async update(d){const cur=mem.get(p);if(!cur)throw{code:'invalid_argument'};const v={...cur,...JSON.parse(JSON.stringify(d))};await tx(s=>s.put(v,p));mem.set(p,v);emit([p])},
    async delete(){await tx(s=>s.delete(p));mem.delete(p);emit([p])},
    async get(){return docSnap(p)},
    onSnapshot(fn){const l={kind:'doc',path:p,fn};listeners.add(l);setTimeout(()=>fn(docSnap(p)));return()=>listeners.delete(l)}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||rid())),
    onSnapshot(fn){const l={kind:'col',path:c,fn};listeners.add(l);setTimeout(()=>fn(colSnap(c)));return()=>listeners.delete(l)}}}
  function dump(){const o={};for(const [k,v] of mem)o[k]=v;return o}
  async function replaceAll(obj){
    const old=[...mem.keys()];
    await tx(s=>{s.clear();for(const k in obj)s.put(obj[k],k)});
    mem.clear();for(const k in obj)mem.set(k,obj[k]);
    emit([...new Set([...old,...Object.keys(obj),'settings/main','clients/x','bons/x','payments/x','stock/x'])]);
  }
  return{load,doc,collection,dump,replaceAll};
})();

/* ---------- backup ---------- */
const BK_KEY='daftar-last-backup';
function lastBackup(){try{return localStorage.getItem(BK_KEY)}catch(_){return null}}
function setLastBackup(){try{localStorage.setItem(BK_KEY,today())}catch(_){}}
function backupFile(){
  const data={app:'daftar-zujaj',version:1,exportedAt:new Date().toISOString(),docs:LocalDB.dump()};
  const name=`daftar-zujaj-${today()}.json`;
  return new File([JSON.stringify(data)],name,{type:'application/json'});
}
function downloadFile(f){const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
let pendingImport=null, installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view.name==='set')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('تثبت التطبيق في الشاشة.')});

/* ---------- boot ---------- */
render();
(async()=>{
  try{if(!window.indexedDB)throw 0;await LocalDB.load()}catch(e){dbState='none';render();return}
  db=LocalDB;dbState='ok';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const fail=()=>toast('صرا مشكل في القراية. عاود حل التطبيق.');
  const asMap=q=>Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));
  db.doc('settings/main').onSnapshot(s=>{S.types=s.exists&&Array.isArray(s.data().types)&&s.data().types.length?s.data().types:null;refresh()},fail);
  db.collection('clients').onSnapshot(q=>{S.clients=asMap(q);S.ok.c=true;refresh()},fail);
  db.collection('bons').onSnapshot(q=>{S.bons=asMap(q);S.ok.b=true;refresh()},fail);
  db.collection('payments').onSnapshot(q=>{S.pays=asMap(q);S.ok.p=true;refresh()},fail);
  db.collection('stock').onSnapshot(q=>{S.stock=asMap(q);S.ok.k=true;refresh()},fail);
  render();
})();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
