<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gessoum Glass</title>
<meta name="theme-color" content="#eef3f2">
<meta name="description" content="Gessoum Glass: البيع بالكريدي، ديون الحرفيين، ومخزون الزجاج">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gessoum Glass">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<script>
try{var p=JSON.parse(localStorage.getItem('sz-prefs')||'{}');var h=document.documentElement;
if(p.theme==='dark'||p.theme==='light')h.setAttribute('data-theme',p.theme);
if(p.lang==='fr'){h.lang='fr';h.dir='ltr'}}catch(e){}
</script>
<style>
/* Layout: phone-first ledger. Sticky brand bar, one scrolling column, five-tab bottom bar with a raised "new sale" button. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface2:#f6f9f8; --sunk:#e5edeb; --ink:#10201e; --muted:#566865; --faint:#869794; --line:#d9e3e1;
  --accent:#17635e; --accent-2:#0f4b47; --accent-ink:#ffffff; --accent-soft:#dbece8; --edge:#9fd3c7;
  --debt:#b0392d; --debt-soft:#f8e2de; --warn:#8f5d0a; --warn-soft:#f6ebd2; --ok:#22703e; --ok-soft:#dcefe2;
  --shadow:0 1px 2px rgba(16,32,30,.05),0 6px 18px rgba(16,32,30,.06);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --surface:#13201e; --surface2:#162523; --sunk:#1b2c2a; --ink:#e3eeec; --muted:#98aba8; --faint:#6c807d; --line:#243735;
  --accent:#4fb3a8; --accent-2:#74cbc0; --accent-ink:#04201d; --accent-soft:#173936; --edge:#2b665e;
  --debt:#f2877c; --debt-soft:#3a1f1b; --warn:#e6ae57; --warn-soft:#382b13; --ok:#70cc90; --ok-soft:#153123;
  --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* top bar */
.top{position:sticky;top:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.15;display:block}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:4px calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.32rem;margin:0;text-wrap:balance;line-height:1.3}
h3{font-size:.78rem;font-weight:600;color:var(--muted);margin:6px 0 0;letter-spacing:.03em;text-transform:uppercase}
.note{font-size:.85rem;color:var(--muted)}
p.note{margin:0;max-width:60ch}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.hero{background:linear-gradient(160deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:30px;transform:rotate(25deg);background:rgba(255,255,255,.08)}
.hero .lbl{font-size:.82rem;opacity:.85}
.hero .big{font-family:var(--f-body);font-size:2.15rem;font-weight:700;line-height:1.1}
.hero .big small{font-size:1rem;font-weight:500;opacity:.85}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem}
.hero .sub b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.tile .lbl{font-size:.76rem;color:var(--muted)}
.tile .v{font-weight:700;font-size:1.12rem}
.tile .v.ok{color:var(--ok)}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.svc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.svc-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.svc-chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.svc-n{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.svc-n input{width:64px;padding:6px 8px}
.cutbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px}
.cutbox svg{width:100%;height:auto;display:block}
.rc .words{margin:8px 0 0;font-size:11.5px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--ink);box-shadow:var(--shadow);text-align:center;line-height:1.25}
.qa .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.sec h3{margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:start;width:100%;min-height:58px}
.row:last-child{border-bottom:0}
button.row:active,button.row:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:1rem}
.av.bad{background:var(--debt-soft);color:var(--debt)}
.av.warn{background:var(--warn-soft);color:var(--warn)}
.rleft{display:flex;align-items:center;gap:12px;min-width:0}
.rmain{display:flex;flex-direction:column;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:.78rem;color:var(--muted)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.amt{font-weight:700;white-space:nowrap}
.amt.neg{color:var(--debt)}
.amt.pos{color:var(--ok)}
.chip{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--debt-soft);color:var(--debt)}
.acts{display:flex;gap:6px}
.mini-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent);text-decoration:none}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* chart */
.chart{padding:14px 16px 10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* buttons & forms */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--accent);padding-inline:8px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--debt);border:1px solid var(--debt-soft)}
.btn.danger[data-armed]{background:var(--debt);color:var(--surface)}
.btn.full{width:100%;padding-block:13px}
.btn:disabled{opacity:.55;cursor:default}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{width:100%}
.line-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.lt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.ld{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lu{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.lr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:7px 10px;gap:8px;flex-wrap:wrap}
.lr b{color:var(--ink)}
.avail{font-size:.8rem}
.avail.short{color:var(--debt);font-weight:600}
.x{background:transparent;border:1px solid var(--line);border-radius:11px;width:44px;height:44px;color:var(--muted);font-size:1.1rem}
.totals{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.trow.big{font-size:1.2rem;font-weight:700}
.quickpay{display:flex;gap:6px;flex-wrap:wrap}
.quickpay button{background:var(--sunk);border:0;border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ledger rows */
.led{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.le{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.le:last-child{border-bottom:0}
button.le:hover{background:var(--surface2)}
.le .what{font-weight:600}
.le .d{font-size:.78rem;color:var(--muted)}
.le .run{font-size:.78rem;color:var(--muted);text-align:end}
.le .a{text-align:end;font-weight:700}
.le.pay .a{color:var(--ok)}
.le .del{grid-column:2;grid-row:2;justify-self:end;padding:3px 10px;font-size:.75rem}
.balbox{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--edge);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-weight:600;color:var(--muted);font-size:.74rem;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl.doc{font-size:.86rem}.tbl.doc th,.tbl.doc td{white-space:nowrap;vertical-align:middle;padding:10px 9px}
.tbl.doc .n{text-align:end;font-variant-numeric:tabular-nums}.tbl.doc .b{font-weight:700}.tbl.doc .w{white-space:normal;min-width:110px;max-width:170px}
.tbl input{padding:7px 8px;border-radius:8px;min-width:90px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.typerow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.copyfall{width:100%;min-height:140px;font-size:.85rem}

/* stock */
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.sk .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sk .q{font-size:1.4rem;font-weight:700;line-height:1.2}
.sk .q.low{color:var(--warn)}
.sk .q.out{color:var(--debt)}
.sk .meta{font-size:.76rem;color:var(--muted);display:flex;flex-direction:column}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn)}.bar i.out{background:var(--debt)}

/* settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.set-row:last-child{border-bottom:0}
.set-row .t{display:flex;align-items:center;gap:12px;min-width:0}
.set-row .t span{display:flex;flex-direction:column}
.set-row .t small{color:var(--muted);font-size:.78rem}
.set-row .ib{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.set-block{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.set-block:last-child{border-bottom:0}
.profile{display:flex;align-items:center;gap:14px;padding:16px}
.profile .av{width:52px;height:52px;border-radius:16px;font-size:1.3rem}

/* steps (import) */
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.prompt{background:var(--sunk);border-radius:12px;padding:12px;font-size:.84rem;white-space:pre-wrap;line-height:1.6}

/* gate (login) */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 70% at 50% 0%,var(--accent-soft),var(--bg) 70%)}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.gate-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gate-head .mark{width:72px;height:72px;border-radius:20px}
.gate-head b{font-family:var(--f-disp);font-size:1.6rem;font-weight:700}
.gate-head span{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.gate-lang{display:flex;justify-content:center}
.gate-lang .seg{width:180px}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-align:center;background:var(--sunk);border-radius:12px;padding:14px;direction:ltr}
.err{color:var(--debt);font-size:.86rem;min-height:1.2em;margin:0}

/* bottom nav */
nav.bottom{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:620px;margin:0 auto;align-items:end}
nav.bottom button{background:transparent;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--faint)}
nav.bottom button.on{color:var(--accent)}
nav.bottom button.main{transform:translateY(-12px)}
nav.bottom button.main .ib{width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
nav.bottom button.main .ic{width:26px;height:26px;stroke-width:2.2}
nav.bottom button.main span{color:var(--accent)}
#print{display:none}
.rc{max-width:148mm;margin:0 auto;font-family:var(--f-body);color:#111;background:#fff;padding:8mm 6mm;font-size:12px;line-height:1.5}
.rc-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid #17635e;padding-bottom:8px;margin-bottom:8px}
.rc-head .mark{width:46px;height:46px;border-radius:12px}
.rc-head b{font-family:var(--f-disp);font-size:18px;display:block;color:#0f4b47}
.rc-head small{color:#555;display:block}
.rc-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.rc-meta b{font-size:14px}
.rc table{width:100%;border-collapse:collapse;font-size:11.5px}
.rc th{background:#eef5f3;text-align:start;padding:5px 4px;border-bottom:1px solid #bbb;font-weight:600}
.rc td{padding:5px 4px;border-bottom:1px solid #ddd;font-variant-numeric:tabular-nums}
.rc .tot{margin-top:8px;display:grid;gap:3px;margin-inline-start:auto;width:60%}
.rc .tot div{display:flex;justify-content:space-between;gap:10px}
.rc .tot .g{font-size:15px;font-weight:700;border-top:2px solid #17635e;padding-top:4px}
.rc-logo{max-width:90px;max-height:56px;object-fit:contain;border-radius:6px}
.rc.tk{max-width:72mm;width:72mm;padding:2mm 1mm;font-size:11px;line-height:1.4}
.rc.tk .tk-h{text-align:center;display:grid;justify-items:center;gap:1px}.rc.tk .tk-h b{font-size:14px}.rc.tk .tk-h small{color:#333;font-size:10px}
.rc.tk .tk-sep{border-top:1px dashed #000;margin:5px 0}.rc.tk .tr{display:flex;justify-content:space-between;gap:6px}.rc.tk .tr.big{font-size:13px}
.rc.tk .tk-l{margin:3px 0}.rc.tk .tk-l>div:first-child{font-weight:600}.rc.tk .tk-f{text-align:center;font-size:10px}
.rc-foot{margin-top:14px;text-align:center;color:#555;font-size:11px;border-top:1px dashed #bbb;padding-top:8px}
@media print{
  @page{margin:6mm}
  html,body{background:#fff!important}
  body.printing #shell,body.printing #gate,body.printing #boot,body.printing #toast{display:none!important}
  body.printing #print{display:block}
}
.modal{position:fixed;inset:0;background:rgba(5,15,14,.5);z-index:30;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.modal{place-items:center}}
.sheet{background:var(--surface);border-radius:22px;max-width:440px;width:100%;padding:20px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-size:1.15rem}
.sheet .sico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--debt-soft);color:var(--debt)}
.sheet .sico.info{background:var(--accent-soft);color:var(--accent)}
.sheet ul{margin:0;padding-inline-start:18px;color:var(--muted);font-size:.88rem}
.btn.dangerfill{background:var(--debt);color:#fff}
.toast .undo{background:none;border:0;color:var(--edge);font-weight:700;margin-inline-start:12px;padding:2px 4px;font-size:.9rem}
.toast{display:flex;align-items:center;justify-content:center;gap:4px}
.toast[hidden]{display:none!important}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--faint);flex-shrink:0}
.sdot.ok{background:var(--ok)}.sdot.warn{background:var(--warn)}.sdot.bad{background:var(--debt)}
/* wide screens: software layout with side menu */
#side{display:none}
.tbl.stat td,.tbl.stat th{white-space:nowrap}.tbl.stat tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface2)}.tbl.stat .link{padding:0;font-weight:600}
#shell{overflow-x:clip}.app{overflow-wrap:anywhere;min-width:0}.rname,.rsub,.what,h2{overflow-wrap:anywhere;word-break:break-word}
.st-chip{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-prep{background:var(--warn-soft);color:var(--warn)}.st-ready{background:var(--accent-soft);color:var(--accent)}.st-done{background:var(--sunk);color:var(--muted)}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.jrow:last-child{border-bottom:0}button.jrow:hover{background:var(--surface2)}
.jrow .t1{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.jrow .t2{font-size:.78rem;color:var(--muted)}
.jrow .r{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qty{width:76px;padding:7px 8px}
.searchbox{position:relative}.searchbox input{padding-inline-start:40px}.searchbox .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
@media (min-width:900px){
  #shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
  #side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;grid-row:1/span 3}
  #side .brand{padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  #side .sgrp{font-size:.7rem;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:12px 10px 4px}
  #side button.si{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;font-size:.9rem;color:var(--muted);text-align:start;width:100%}
  #side button.si:hover{background:var(--surface2);color:var(--ink)}
  #side button.si.on{background:var(--accent-soft);color:var(--accent)}
  #side button.si.new{background:var(--accent);color:var(--accent-ink);justify-content:center;margin:6px 0}
  #side .badge{margin-inline-start:auto;font-size:.7rem;background:var(--debt-soft);color:var(--debt);border-radius:99px;padding:1px 7px}
  .top{grid-column:2}.top .brand{visibility:hidden}
  .app{grid-column:2;max-width:1120px;width:100%;padding-inline:28px;padding-block:8px 48px}
  nav.bottom{display:none}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(6,minmax(0,1fr))}
  .skgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toast{bottom:24px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (max-width:360px){.skgrid,.tiles{grid-template-columns:minmax(0,1fr)}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}

let SNDC=null;
function sndCtx(){try{if(!SNDC)SNDC=new (window.AudioContext||window.webkitAudioContext)();if(SNDC.state==='suspended')SNDC.resume();return SNDC}catch(_){return null}}
document.addEventListener('pointerdown',()=>{if(prefs.sound!==false)sndCtx()},{passive:true});
function sTone(c,f,t0,dur,type,vol,f2){const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05)}
function sound(k){if(prefs.sound===false)return;const c=sndCtx();if(!c)return;try{
  if(k==='paid'){sTone(c,1318.5,0,0.35,'triangle',0.25);sTone(c,2637,0,0.25,'sine',0.08);sTone(c,1760,0.11,0.7,'triangle',0.28);sTone(c,3520,0.11,0.5,'sine',0.08);for(let i=0;i<6;i++)sTone(c,3200+Math.random()*1800,0.2+i*0.045,0.12,'sine',0.06)}
  else if(k==='debt'){sTone(c,392,0,0.35,'triangle',0.25);sTone(c,311.1,0.3,0.7,'triangle',0.25)}
  else if(k==='add'){sTone(c,784,0,0.18,'sine',0.22,1046.5);sTone(c,1174.7,0.12,0.45,'sine',0.22);sTone(c,2349.3,0.12,0.3,'sine',0.05)}
}catch(_){}}
const isFr=()=>prefs.lang==='fr';
const tr=(a,f)=>isFr()?f:a;
function applyPrefs(){
  const h=document.documentElement;h.lang=prefs.lang;h.dir=isFr()?'ltr':'rtl';
  if(prefs.theme==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',prefs.theme);
  const dark=prefs.theme==='dark'||(prefs.theme==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0b1312':'#eef3f2';
  document.title='Gessoum Glass';
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(prefs.theme==='system')applyPrefs()})}catch(_){}

/* ====================== helpers ====================== */
const TYPES0=[{id:'stp4',name:'STP 4',price:2000},{id:'sabli',name:'صابلي',price:2900},{id:'miroir',name:'مرآة',price:2300},{id:'warda',name:'وردة',price:2800}];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const loc=()=>isFr()?'fr-FR':'en-US';
const grp=n=>{const r=Math.round(n);return(r<0?'-':'')+Math.abs(r).toLocaleString(loc()).replace(/ /g,' ')};
const grpTxt=n=>Math.round(n).toLocaleString('en-US');
const APP_VER=28; // نفس الرقم تاع VERSION في sw.js
const CUR=()=>tr('دج','DA');
const DA=n=>`<bdi dir="ltr">${grp(n)}</bdi>&nbsp;${CUR()}`;
const dec2=a=>(Math.round(a*100)/100).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
const M2=a=>`<bdi dir="ltr">${dec2(a)}</bdi>&nbsp;${tr('م²','m²')}`;
/* وزن الزجاج: 2.5 كغ لكل م² على كل ملم سمك */
const KG_MM=2.5;
const guessMM=name=>{const m=String(name||'').match(/(\d+(?:[.,]\d+)?)/);const v=m?num(m[1]):0;return v>=2&&v<=25?v:0};
const typeMM=t=>!t?0:num(t.mm)>0?num(t.mm):guessMM(t.name);
const mmOf=id=>typeMM(types().find(x=>x.id===id));
const kgOf=(area,mm)=>area*mm*KG_MM;
const KG=k=>{const r=k>=100?Math.round(k):Math.round(k*10)/10;return `<bdi dir="ltr">${r.toLocaleString(loc(),{maximumFractionDigits:1})}</bdi>&nbsp;${tr('كغ','kg')}`};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const fdate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `<bdi dir="ltr">${d}/${m}/${y}</bdi>`};

const fdateTxt=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};

const lineCalc=l=>{if(l.lk==='art'){const amount=Math.round(num(l.price)*num(l.qty));return{area:0,bill:0,glass:amount,svc:0,amount}}
  const w=num(l.w),h=num(l.h),q=num(l.qty),a1=w*h/10000,area=a1*q,ma=minArea(),bill=(ma>0&&a1>0?Math.max(a1,ma):a1)*q;
  let svc=0;const per=2*(w+h)/100*q;for(const x of svcs()){const v=(l.svc||{})[x.id];if(!v||!(num(x.price)>0))continue;svc+=x.unit==='ml'?per*num(x.price):num(v)*q*num(x.price)}
  const glass=Math.round(bill*num(l.price));svc=Math.round(svc);return{area,bill,glass,svc,amount:glass+svc}};

const unitTr=u=>{const x=UNITS.find(y=>y[0]===u||y[1]===u);return x?tr(x[0],x[1]):(u||'')};

const dec2s=v=>{const r=Math.round(num(v)*100)/100;return `<bdi dir="ltr">${Number.isInteger(r)?grp(r):r.toLocaleString(loc(),{maximumFractionDigits:2})}</bdi>`};

/* price for a glass type or an article, depending on customer */
function priceOf(kind,id,mode,clientId,u){
  const c=mode==='walk'?null:S.clients[clientId];let base;
  if(kind==='glass'){const t=types().find(x=>x.id===id);if(!t)return 0;
    if(mode==='walk')return num(t.priceW)||num(t.price);
    const sp=c&&c.sp&&num(c.sp[id]);if(sp>0)return sp;base=num(t.price)}
  else{const a=S.arts[id];if(!a)return 0;const n=artFactor(a,u);
    if(mode==='walk'){if(u==='pack'&&num(a.packPriceW)>0)return num(a.packPriceW);return (num(a.priceW)||num(a.price))*n}
    const sp=c&&c.sp&&num(c.sp['a:'+id]);if(sp>0)return sp*n;
    base=u==='pack'&&num(a.packPrice)>0?num(a.packPrice):num(a.price)*n}
  const d=c?num(c.disc):0;return d>0?Math.round(base*(1-d/100)):base;
}
function artCostAt(id,date){let best=null;for(const m of Object.values(S.amv)){if(m.kind!=='in'||m.articleId!==id||num(m.qty)<=0)continue;if(date&&m.date>date)continue;if(!best||m.date>best.date||(m.date===best.date&&(m.createdAt||0)>(best.createdAt||0)))best=m}
  if(best)return num(best.unitCost);const a=S.arts[id];return a&&num(a.cost)>0?num(a.cost):null}

/* ====================== storage on the phone (IndexedDB) ====================== */
const LocalDB=(()=>{
  let idb=null,hook=null,ehook=null;const mem=new Map();const listeners=new Set();
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const colOf=p=>p.slice(0,p.lastIndexOf('/'));
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open('daftar-zujaj',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
  async function load(){idb=await open();await new Promise((res,rej)=>{const rq=idb.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
  function tx(fn){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=()=>res();const bad=()=>rej({code:t.error&&t.error.name==='QuotaExceededError'?'quota_exceeded':'unavailable',message:String(t.error)});t.onerror=bad;t.onabort=bad})}
  const docSnap=p=>{const d=mem.get(p);return{id:p.slice(p.lastIndexOf('/')+1),exists:d!==undefined,data:()=>d}};
  const colSnap=c=>{const docs=[];for(const [k,v] of mem)if(colOf(k)===c)docs.push({id:k.slice(k.lastIndexOf('/')+1),exists:true,data:()=>v});return{docs,size:docs.length,empty:!docs.length}};
  function emit(paths){const cols=new Set(paths.map(colOf));for(const l of listeners){if(l.kind==='doc'&&paths.includes(l.path))l.fn(docSnap(l.path));if(l.kind==='col'&&cols.has(l.path))l.fn(colSnap(l.path))}}
  function doc(p){return{id:p.slice(p.lastIndexOf('/')+1),path:p,
    async set(d){const old=mem.get(p);const v=JSON.parse(JSON.stringify(d));await tx(s=>s.put(v,p));mem.set(p,v);emit([p]);hook&&hook([p]);ehook&&ehook(p,old,v)},
    async update(d){const cur=mem.get(p);if(!cur)throw{code:'invalid_argument'};const v={...cur,...JSON.parse(JSON.stringify(d))};await tx(s=>s.put(v,p));mem.set(p,v);emit([p]);hook&&hook([p]);ehook&&ehook(p,cur,v)},
    async delete(){const old=mem.get(p);await tx(s=>s.delete(p));mem.delete(p);emit([p]);hook&&hook([p]);ehook&&old!==undefined&&ehook(p,old,undefined)},
    async get(){return docSnap(p)},
    onSnapshot(fn){const l={kind:'doc',path:p,fn};listeners.add(l);setTimeout(()=>fn(docSnap(p)));return()=>listeners.delete(l)}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||rid())),onSnapshot(fn){const l={kind:'col',path:c,fn};listeners.add(l);setTimeout(()=>fn(colSnap(c)));return()=>listeners.delete(l)}}}
  function dump(){const o={};for(const [k,v] of mem)if(!k.startsWith('__'))o[k]=v;return o}
  async function applyRemote(list){await tx(s=>{for(const [k,v] of list){if(v===null)s.delete(k);else s.put(v,k)}});for(const [k,v] of list){if(v===null)mem.delete(k);else mem.set(k,v)}emit(list.map(x=>x[0]))}
  const keys=()=>[...mem.keys()].filter(k=>!k.startsWith('__'));
  const setHook=fn=>{hook=fn};const setEvtHook=fn=>{ehook=fn};
  async function replaceAll(obj){const old=[...mem.keys()];await tx(s=>{s.clear();for(const k in obj)s.put(obj[k],k)});mem.clear();for(const k in obj)mem.set(k,obj[k]);
    emit([...new Set([...old,...Object.keys(obj),'settings/main','clients/x','bons/x','payments/x','stock/x','auth/main'])])}
  const raw=p=>{const v=mem.get(p);return v===undefined?undefined:JSON.parse(JSON.stringify(v))};
  return{load,doc,collection,dump,replaceAll,raw,applyRemote,keys,setHook,setEvtHook};
})();

    $('#g-pass').value='';return setErr(n>=5?tr('5 محاولات خاطئة. انتظر 30 ثانية.','5 essais erronés. Attendez 30 s.'):tr('اسم المستخدم أو كلمة السر غير صحيحة.','Nom d’utilisateur ou mot de passe incorrect.'))}
  if(form==='forgot'){
    const a=S.auth,code=v('g-code').replace(/\D/g,''),p1=v('g-pass'),p2=v('g-pass2');
    const f=failState();if(f.until>Date.now())return setErr(tr('محاولات كثيرة. انتظر قليلاً.','Trop d’essais. Patientez.'));
    if(await hashPw(code,a.rsalt)!==a.rhash){const n=f.n+1;setFail({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});return setErr(tr('رمز الاسترجاع غير صحيح.','Code de secours incorrect.'))}
    if(p1.length<4)return setErr(tr('يجب أن تتكون كلمة السر من 4 أحرف على الأقل.','Le mot de passe doit faire au moins 4 caractères.'));
    if(p1!==p2)return setErr(tr('كلمتا السر غير متطابقتين.','Les mots de passe ne correspondent pas.'));
    const salt=randB64();const hash=await hashPw(p1,salt);
    if(await write(()=>db.doc('auth/main').update({salt,hash}),tr('تم تغيير كلمة السر.','Mot de passe changé.'))){setFail({n:0,until:0});unlocked=true;touch(true);gateMode=null;gateErr='';startApp()}
  }
}

function chart7(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const s=days.map(d=>0),p=days.map(d=>0);
  for(const id in S.bons){const b=S.bons[id];if(b.kind==='opening')continue;const i=days.indexOf(b.date);if(i>=0)s[i]+=num(b.total)}
  for(const id in S.pays){const x=S.pays[id];const i=days.indexOf(x.date);if(i>=0)p[i]+=num(x.amount)}
  for(const id in S.bons){const b=S.bons[id];if(!b.walkin)continue;const i=days.indexOf(b.date);if(i>=0)p[i]+=num(b.total)}
  const max=Math.max(...s,...p);if(!max)return'';
  const W=320,H=130,top=10,bot=22,ch=H-top-bot,gw=W/7,bw=Math.min(14,gw/3);
  const y=v=>top+ch-(v/max)*ch;
  const lab=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(isFr()?'fr-FR':'ar-DZ-u-nu-latn',{weekday:'short'})}catch(_){return d.slice(8)}};
  let g='';
  for(let i=0;i<7;i++){const ii=isFr()?i:6-i,cx=gw*ii+gw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(s[i])}" width="${bw}" height="${Math.max(0,top+ch-y(s[i]))}" rx="3" fill="var(--accent)"/>`;
    g+=`<rect x="${cx+1}" y="${y(p[i])}" width="${bw}" height="${Math.max(0,top+ch-y(p[i]))}" rx="3" fill="var(--edge)"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lab(days[i]))}</text>`}
  return `<div class="sec"><h3>${tr('آخر 7 أيام','7 derniers jours')}</h3><span class="note">${tr('أعلى يوم','Max')} ${DA(max)}</span></div>
  <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('المبيعات والمداخيل','Ventes et encaissements')}"><line x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)"/><line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 4"/>${g}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>${tr('مبيعات','Ventes')}</span><span><i style="background:var(--edge)"></i>${tr('مداخيل','Encaissements')}</span></div></div>`;
}

function releveText(id,f='0000-01-01',t='9999-12-31'){
  const c=S.clients[id]||{name:'?'};const all=entries(id);const per=f>'0000-01-01';
  let open=0;const rows=[];for(const x of all){if(x.date<f)open+=x.amt;else if(x.date<=t)rows.push(x)}
  const L=[shopName(),`${tr('كشف حساب','Relevé')}: ${c.name}`];
  if(c.owner)L.push(`${tr('المسؤول','Responsable')}: ${c.owner}`);
  if(c.phone)L.push(`${tr('الهاتف','Tél')}: ${c.phone}`);
  if(per)L.push(`${tr('من','Du')} ${fdateTxt(f)} ${tr('إلى','au')} ${fdateTxt(t)}`);
  L.push(`${tr('بتاريخ','Le')} ${fdateTxt(today())}`,'');
  let run=open;
  if(per)L.push(`${tr('الرصيد السابق','Solde antérieur')}: ${grpTxt(open)} ${CUR()}`,'');
  const money=v=>`${v<0?'-'+grpTxt(-v):grpTxt(v)} ${CUR()}`;
  for(const x of rows){run+=x.amt;
    if(x.k==='bon'){const bb=x.b;const lbl=bb.kind==='opening'?tr('دين قديم','Ancien crédit'):bb.kind==='return'?tr('مرتجع','Retour')+' '+(bb.num||''):tr('فاتورة','Facture')+' '+(bb.num||'');
      L.push(`${fdateTxt(x.date)}  ${lbl}: ${money(x.amt)}  | ${tr('الرصيد','Solde')}: ${money(run)}`);
      for(const l of bb.lines||[])L.push(l.lk==='art'?`   - ${l.type} × ${l.qty} ${l.unit||''} = ${grpTxt(l.amount)} ${CUR()}`:`   - ${l.type}${l.use?' ('+l.use+')':''} ${l.w}x${l.h} cm × ${l.qty} = ${grpTxt(l.amount)} ${CUR()}`)}
    else L.push(`${fdateTxt(x.date)}  ${tr('دفع','Paiement')}${x.p.method?' ('+payMName(x.p.method)+')':''}: ${money(x.amt)}  | ${tr('الرصيد','Solde')}: ${money(run)}`);
  }
  if(!rows.length)L.push(tr('ما كاين حتى عملية في هذي الفترة.','Aucune opération sur cette période.'));
  L.push('',`${tr('الرصيد المتبقي','Solde restant')}: ${money(run)}`,`${tr('أُوقف هذا الكشف على مبلغ','Arrêté le présent relevé à la somme de')}: ${amountWords(run)}`);
  return L.join('\n');
}

function frWords(n){
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const t=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const u99=n=>{if(n<20)return u[n];const d=Math.floor(n/10),r=n%10;if(d===7||d===9)return t[d]+(d===7&&r===1?' et ':'-')+u[10+r];if(r===0)return d===8?t[d]+'s':t[d];if(r===1&&d!==8)return t[d]+' et un';return t[d]+'-'+u[r]};
  const u999=n=>{const c=Math.floor(n/100),r=n%100;let x='';if(c)x=(c>1?u[c]+' ':'')+'cent'+(c>1&&r===0?'s':'');if(r)x+=(x?' ':'')+u99(r);return x};
  if(n===0)return 'zéro';const parts=[];const g=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(g)parts.push(u999(g)+' milliard'+(g>1?'s':''));if(m)parts.push(u999(m)+' million'+(m>1?'s':''));
  if(k)parts.push(k===1?'mille':u999(k).replace(/cents$/,'cent').replace(/vingts$/,'vingt')+' mille');if(r)parts.push(u999(r));return parts.join(' ');
}
function arWords(n){
  if(n===0)return 'صفر';
  const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const H=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const a99=n=>n<20?U[n]:(n%10?U[n%10]+' و'+T[Math.floor(n/10)]:T[Math.floor(n/10)]);
  const a999=n=>[H[Math.floor(n/100)],n%100?a99(n%100):''].filter(Boolean).join(' و');
  const sc=(k,one,two,pl)=>k===1?one:k===2?two:k<=10?a999(k)+' '+pl:a999(k)+' '+one;
  const parts=[[Math.floor(n/1e9),'مليار','ملياران','مليارات'],[Math.floor(n%1e9/1e6),'مليون','مليونان','ملايين'],[Math.floor(n%1e6/1e3),'ألف','ألفان','آلاف']].filter(x=>x[0]).map(x=>sc(...x));
  if(n%1000)parts.push(a999(n%1000));return parts.join(' و');
}
function amountWords(n){n=Math.round(Math.abs(num(n)));return isFr()?frWords(n)+(n>1?' dinars algériens':' dinar algérien'):'فقط '+arWords(n)+' دينار جزائري لا غير'}

  let u=c.toDataURL('image/png');if(u.length>160000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}URL.revokeObjectURL(url);res(u)}catch(_){res(null)}};img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url})}

function evHook(p,old,nw){
  const col=p.slice(0,p.indexOf('/'));if(EV_SKIP.has(col))return;
  let e;try{e=evDesc(p,old,nw)}catch(_){e={title:col,det:[],link:null,op:!old?'add':!nw?'del':'upd',kind:'set'}}
  if(!e)return;
  if(evCtx){evCtx.items.push(e);return}
  evWrite(e);
}
function evWrite(e){try{const t=Date.now();db.collection('events').doc((9e12-t).toString(36)+Math.random().toString(36).slice(2,6)).set({t,op:e.op,kind:e.kind,title:e.title,det:(e.det||[]).slice(0,40),link:e.link||null,user:(S.auth&&S.auth.name)||'',dev:DEV,n:e.n||0}).catch(()=>{})}catch(_){}}
async function evBatch(title,fn,op,mainPath){
  const prev=evCtx;evCtx={items:[]};let r;
  try{r=await fn()}finally{const items=evCtx.items;evCtx=prev;
    if(items.length===1&&!/^(تراجع|Annulation)/.test(title))evWrite(items[0]);
    else if(items.length){const main=items[items.length-1];evWrite({title,op:op||main.op,kind:main.kind,link:op==='del'?null:main.link,n:items.length,det:items.slice(0,40).map(x=>x.title)})}}
  return r;
}
function evLinkOk(l){if(!l)return false;if(l.v==='art')return !!S.arts[l.id];if(l.v==='client')return !!S.clients[l.id];if(l.v==='bonview')return !!S.bons[l.id];if(l.v==='sup')return !!S.sups[l.id];if(l.v==='quoteview')return !!S.quotes[l.id];return true}
function evRows(){

function invoiceCSVRows(list){

/* ---- global search ---- */
let sq='';
function searchHTML(){return `<div class="stack"><h2>${tr('بحث','Recherche')}</h2><div class="searchbox">${ic('search')}<input id="gsq" type="search" value="${esc(sq)}" placeholder="${tr('اسم حرفي، رقم فاتورة، هاتف، مورّد…','Client, n° de facture, téléphone, fournisseur…')}" autocomplete="off"></div><div id="gsr">${searchResults()}</div></div>`}
function searchResults(){
  const q=sq.trim().toLowerCase();if(!q)return `<p class="note">${tr('اكتب للبحث في كل الدفتر.','Tapez pour chercher dans tout le registre.')}</p>`;
  const qd=q.replace(/\s/g,'');const has=v=>String(v||'').toLowerCase().includes(q)||String(v||'').replace(/\s/g,'').includes(qd);
  const cl=Object.entries(S.clients).filter(([,c])=>has(c.name)||has(c.owner)||has(c.phone)).slice(0,8);
  const bo=Object.entries(S.bons).filter(([,b])=>String(b.num)===q.replace(/^#/,'')||has(custName(b))&&b.walkin||has(b.cphone)).slice(0,10);
  const su=Object.entries(S.sups).filter(([,x])=>has(x.name)||has(x.phone)).slice(0,5);
  const ar=Object.entries(S.arts).filter(([,x])=>has(x.name)||has(x.ref)).slice(0,6);
  const qu=Object.entries(S.quotes).filter(([,x])=>String(x.num)===q||has(custName(x))).slice(0,5);
  if(!cl.length&&!bo.length&&!su.length&&!qu.length&&!ar.length)return `<div class="empty"><p>${tr('لا نتائج.','Aucun résultat.')}</p></div>`;
  const sec=(t,items)=>items?`<h3>${t}</h3><div class="list">${items}</div>`:'';
  return sec(tr('الزبائن','Clients'),cl.map(([id,c])=>`<button class="row" data-act="open-client" data-id="${id}"><span class="rleft"><span class="av">${esc(initial(c.name))}</span><span class="rmain"><span class="rname">${esc(c.name)}</span><span class="rsub">${c.phone?`<bdi dir="ltr">${esc(c.phone)}</bdi>`:''}</span></span></span><span class="amt ${(S.stats[id]||{}).bal>0?'neg':''}">${DA((S.stats[id]||{bal:0}).bal)}</span></button>`).join(''))
   +sec(tr('الفواتير','Factures'),bo.map(([id,b])=>`<button class="row" data-act="open-bon" data-id="${id}"><span class="rleft"><span class="av">${ic(b.kind==='return'?'undo':'receipt')}</span><span class="rmain"><span class="rname">${b.kind==='return'?tr('مرتجع','Retour'):b.kind==='opening'?tr('دين قديم','Ancien crédit'):tr('فاتورة','Facture')} <bdi dir="ltr">${b.num||''}</bdi> · ${esc(custName(b))}</span><span class="rsub">${fdt(b.date,b.createdAt)}</span></span></span><span class="amt">${DA(b.total)}</span></button>`).join(''))
   +sec(tr('عروض الأسعار','Devis'),qu.map(([id,x])=>`<button class="row" data-act="open-quote" data-id="${id}"><span class="rleft"><span class="av">${ic('doc')}</span><span class="rname">${tr('عرض','Devis')} <bdi dir="ltr">${x.num}</bdi> · ${esc(custName(x))}</span></span><span class="amt">${DA(x.total)}</span></button>`).join(''))
   +sec(tr('السلع','Articles'),ar.map(([id,x])=>`<button class="row" data-act="open-art" data-id="${id}"><span class="rleft"><span class="av">${ic('box')}</span><span class="rname">${esc(x.name)}</span></span><span class="amt">${DA(x.price)}</span></button>`).join(''))
   +sec(tr('الموردون','Fournisseurs'),su.map(([id,x])=>`<button class="row" data-act="open-sup" data-id="${id}"><span class="rleft"><span class="av">${ic('truck')}</span><span class="rname">${esc(x.name)}</span></span><span class="amt neg">${DA((S.sstats[id]||{bal:0}).bal)}</span></button>`).join(''));
}

    <p class="note">${tr('أول مرة: «إنشاء حساب». في هاتف آخر بنفس البيانات: «دخول» بنفس الإيميل وكلمة السر.','Première fois : « Créer le compte ». Sur un autre téléphone : « Se connecter » avec les mêmes identifiants.')}</p>

    <div class="field"><label for="cl-pw">${tr('كلمة السر (6 أحرف على الأقل)','Mot de passe (6 caractères min.)')}</label><input id="cl-pw" type="password" dir="ltr" autocomplete="current-password"></div>
    <p class="err" id="cl-err">${esc(cdl.err)}</p>
    <div class="actions"><button class="btn ghost" data-act="cloud-create">${tr('إنشاء حساب','Créer le compte')}</button><button class="btn" data-act="cloud-login">${tr('دخول','Se connecter')}</button></div>
    <button class="btn plain" data-act="cloud-edit-cfg">${tr('تغيير مفاتيح Firebase','Changer la configuration')}</button></div>`}
  else{body=`<div class="card pad stack" style="gap:10px"><div class="rowflex"><span id="sync-dot" class="sdot"></span><b id="sync-status"></b></div>
    <div class="note">${tr('الحساب','Compte')}: <bdi dir="ltr">${esc(Sync.email)}</bdi> · ${tr('المشروع','Projet')}: <bdi dir="ltr">${esc(cfg.projectId)}</bdi></div>
    <div class="actions"><button class="btn" data-act="cloud-sync">${ic('restore')}${tr('مزامنة الآن','Synchroniser')}</button><button class="btn line" data-act="cloud-off">${tr('إيقاف على هذا الهاتف','Arrêter ici')}</button></div>

let cashDay=null,edraft=null;

const catName=k=>{const c=EXP_CATS.find(x=>x[0]===k)||EXP_CATS[5];return tr(c[1],c[2])};
const shiftDay=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return dstr(x)};
function cashHTML(){
  const d=cashDay||today(),mo=d.slice(0,7);
  const ins=[...Object.values(S.pays).filter(p=>p.date===d).map(p=>({t:p.createdAt||0,label:(S.clients[p.clientId]||{}).name||'?',sub:tr('دفع حرفي','Paiement atelier')+(p.method&&p.method!=='cash'?' · '+payMName(p.method):''),a:num(p.amount),act:'open-client',id:p.clientId})),
    ...Object.entries(S.bons).filter(([,b])=>b.walkin&&b.date===d&&num(b.total)>0).map(([id,b])=>({t:b.createdAt||0,label:custName(b),sub:tr('بيع نقداً · فاتورة ','Vente comptant · facture ')+b.num,a:num(b.total),act:'open-bon',id}))].sort((x,y)=>y.t-x.t);
  const outs=Object.entries(S.exps).filter(([,e])=>e.date===d).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const outs2=[...Object.entries(S.bons).filter(([,b])=>b.walkin&&b.date===d&&num(b.total)<0).map(([id,b])=>({t:b.createdAt,label:tr('استرجاع لزبون','Remboursement client'),sub:custName(b),a:-num(b.total),act:'open-bon',id})),
    ...Object.values(S.spays).filter(x=>x.date===d).map(x=>({t:x.createdAt,label:tr('دفع لمورّد','Paiement fournisseur'),sub:(S.sups[x.supplierId]||{}).name||'',a:num(x.amount),act:'open-sup',id:x.supplierId})),
    ...Object.values(S.stock).filter(m=>m.kind==='in'&&m.date===d&&num(m.paid)>0).map(m=>({t:m.createdAt,label:tr('شراء سلعة','Achat de stock'),sub:(m.supplier||'')+' · '+m.type,a:num(m.paid),act:'open-sup',id:m.supplierId})),
    ...Object.values(S.amv).filter(m=>m.kind==='in'&&m.date===d&&num(m.paid)>0).map(m=>({t:m.createdAt,label:tr('شراء سلعة','Achat de stock'),sub:(m.supplier||'')+' · '+(m.name||''),a:num(m.paid),act:'open-sup',id:m.supplierId}))];
  const tin=ins.reduce((s,x)=>s+x.a,0),tout=outs.reduce((s,[,e])=>s+num(e.amount),0)+outs2.reduce((s,x)=>s+x.a,0);
  let min=0,mout=0;const inM=x=>x&&x.slice(0,7)===mo;for(const p of Object.values(S.pays))if(inM(p.date))min+=num(p.amount);for(const b of Object.values(S.bons))if(b.walkin&&inM(b.date)){if(num(b.total)>0)min+=num(b.total);else mout+=-num(b.total)}
  for(const e of Object.values(S.exps))if(inM(e.date))mout+=num(e.amount);for(const x of Object.values(S.spays))if(inM(x.date))mout+=num(x.amount);for(const m of Object.values(S.stock))if(m.kind==='in'&&inM(m.date))mout+=num(m.paid);for(const m of Object.values(S.amv))if(m.kind==='in'&&inM(m.date))mout+=num(m.paid);
  return `<div class="stack">${backBtn('nav-set',tr('المزيد','Plus'))}

  <div class="tiles"><div class="tile"><span class="lbl">${tr('الداخل','Entrées')}</span><span class="v ok">${DA(tin)}</span></div><div class="tile"><span class="lbl">${tr('الخارج','Sorties')}</span><span class="v" style="color:var(--debt)">${DA(tout)}</span></div></div>
  <div class="balbox"><div><div class="note">${tr('صافي الصندوق لهذا اليوم','Solde de caisse du jour')}</div><div class="amt ${tin-tout<0?'neg':'pos'}" style="font-size:1.5rem">${DA(tin-tout)}</div></div><div class="rside"><span class="note">${tr('هذا الشهر','Ce mois')}: ${DA(min)} − ${DA(mout)}</span><b>= ${DA(min-mout)}</b></div></div>
  <h3>${tr('الداخل','Entrées')}</h3>
  ${ins.length?`<div class="list">${ins.map(x=>`<button class="row" data-act="${x.act}" data-id="${x.id}"><span class="rleft"><span class="av" style="background:var(--ok-soft);color:var(--ok)">${ic('cash')}</span><span class="rmain"><span class="rname">${esc(x.label)}</span><span class="rsub">${esc(x.sub)}${x.t?' · ':''}${ftime(x.t)}</span></span></span><span class="amt pos">+${DA(x.a)}</span></button>`).join('')}</div>`:`<div class="empty"><p>${tr('لا مداخيل في هذا اليوم.','Aucune entrée ce jour.')}</p></div>`}
  ${outs2.length?`<h3>${tr('مدفوعات أخرى','Autres sorties')}</h3><div class="list">${outs2.map(x=>`<button class="row" data-act="${x.act}" data-id="${x.id||''}"><span class="rleft"><span class="av" style="background:var(--debt-soft);color:var(--debt)">${ic('truck')}</span><span class="rmain"><span class="rname">${esc(x.label)}</span><span class="rsub">${esc(x.sub)}${x.t?' · ':''}${ftime(x.t)}</span></span></span><span class="amt neg">−${DA(x.a)}</span></button>`).join('')}</div>`:''}
  <h3>${tr('المصاريف','Dépenses')}</h3>
  ${outs.length?`<div class="led">${outs.map(([id,e])=>`<div class="le"><span class="what">${esc(expLabel(e))}${e.note?' · '+esc(e.note):''}</span><span class="a" style="color:var(--debt)">−${DA(e.amount)}</span><span class="d">${e.time?`<bdi dir="ltr">${esc(e.time)}</bdi>`:ftime(e.createdAt)} · <button class="link" data-act="exp-view" data-id="${id}" style="padding:0">${ic('print')}${tr('الوصل','Reçu')}</button></span><button class="btn danger del" data-act="del-exp" data-id="${id}">${tr('حذف','Supprimer')}</button></div>`).join('')}</div>`:`<div class="empty"><p>${tr('لا مصاريف في هذا اليوم.','Aucune dépense ce jour.')}</p></div>`}
  </div>`;
}

    if(ch==='"'){q=true;continue}
    if(ch===sep){cur.push('');continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;rows.push(cur);cur=[''];continue}
    cur[cur.length-1]+=ch}
  rows.push(cur);
  const money=v=>{let s=String(v||'').replace(/[^\d.,-]/g,'');if(/[.,]\d{1,2}$/.test(s))s=s.replace(/[.,]\d{1,2}$/,'');return s.replace(/[.,]/g,'')};
  const out=[];
  for(const r of rows){const c=r.map(x=>String(x).trim());if(!c.some(Boolean))continue;
    if(BAD_RE.test(c.join('')))continue; /* binary garbage */
    let [name,phone,debt,...rest]=c;
    if(c.length===2){debt=c[1];phone=''}
    const d=money(debt);
    if(!name||name.length>60||!/\d/.test(d||''))continue; /* header or junk */
    phone=String(phone||'').replace(/[^\d+ ]/g,'').trim();if(phone.replace(/\D/g,'').length>15)phone='';
    const big=num(d)>=1e8;
    out.push({name,phone,debt:d,note:(rest.join(' ').trim()+(big?' '+tr('(تحقق: مبلغ كبير بزاف)','(à vérifier : montant très élevé)'):'')).trim(),on:!big});
  }
  return out;
}

  db.collection('suppliers').onSnapshot(q=>{S.sups=asMap(q);refresh()});
  db.collection('spays').onSnapshot(q=>{S.spays=asMap(q);refresh()});
  db.collection('articles').onSnapshot(q=>{S.arts=asMap(q);refresh()});
  db.collection('amoves').onSnapshot(q=>{S.amv=asMap(q);refresh()});
  db.collection('events').onSnapshot(q=>{S.evs=asMap(q);if(view.name==='events')refresh()});
  db.collection('clients').onSnapshot(q=>{S.clients=asMap(q);S.ok.c=true;refresh()});
  db.collection('bons').onSnapshot(q=>{S.bons=asMap(q);S.ok.b=true;refresh()});
  db.collection('payments').onSnapshot(q=>{S.pays=asMap(q);S.ok.p=true;refresh()});
  db.collection('stock').onSnapshot(q=>{S.stock=asMap(q);S.ok.k=true;refresh()});
})();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadCtl=!!navigator.serviceWorker.controller;let reloading=false;
  const busy=()=>['bon','pay','cform','kin','kadj','exp','ret','sform','spay','prices','shop','acct','import','svcs'].includes(view&&view.name);
  const doReload=()=>{if(reloading)return;reloading=true;location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl)return;
    if(!busy())return doReload();
    toast(tr('تحديث جديد جاهز، يتطبّق كي تكمّل هذي الصفحة.','Mise à jour prête, appliquée après ce formulaire.'));
    const t=setInterval(()=>{if(!busy()){clearInterval(t);doReload()}},1500)});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const chk=()=>{if(navigator.onLine)reg.update().catch(()=>{})};
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
    setInterval(chk,30*60*1000)}).catch(()=>{})})}
</script>
